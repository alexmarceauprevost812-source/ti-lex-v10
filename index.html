<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TI-LEX-V10</title>
<style>
:root{--o:#ff6b00;--b:#050505;--p:#111;--l:#333;--m:#aaa;--g:#00cc66;--r:#ff4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,rgba(255,107,0,.18),transparent 40%),#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}.page{display:none}.page.active{display:block}.hidden{display:none!important}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.home{min-height:100vh;display:grid;place-items:center;text-align:center}.logo{width:150px;height:150px;border-radius:32px;margin:auto auto 18px;background:linear-gradient(135deg,var(--o),#ffaa00);display:grid;place-items:center;color:#000;font-weight:950;font-size:48px;box-shadow:0 0 60px rgba(255,107,0,.25)}h1{font-size:clamp(36px,8vw,64px);margin:0;text-transform:uppercase;letter-spacing:-.06em}.accent{color:var(--o)}p{color:var(--m)}.card,.panel{background:rgba(17,17,17,.94);border:1px solid var(--l);border-radius:18px;padding:18px}.auth{width:min(420px,100%);margin:20px auto 0;text-align:left}.btns{display:grid;gap:10px;margin-top:22px}.btn,.small{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover,.small:hover{transform:translateY(-1px);filter:brightness(1.1)}.primary{background:linear-gradient(135deg,var(--o),#ffaa00);color:#000}.secondary{background:transparent;color:var(--o);border:2px solid var(--o)}.ghost,.small{background:#171717;color:#fff;border:1px solid var(--l)}.danger{background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.45);color:#ff9999}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#bbb;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;background:#1b1b1b;color:#fff;border:1px solid var(--l);border-radius:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,107,0,.15)}textarea{min-height:90px;resize:vertical}.alert{padding:12px;border-radius:12px;margin:12px 0}.ok{background:rgba(0,204,102,.1);border:1px solid rgba(0,204,102,.35);color:#8dffc5}.err{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.35);color:#ffaaa6}.head{position:sticky;top:0;background:rgba(7,7,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--l);z-index:4}.headIn{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brandIcon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--o),#ffaa00);color:#000;display:grid;place-items:center}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px 0}.side{background:#101010;border:1px solid var(--l);border-radius:18px;padding:10px;height:max-content}.nav{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;border:0;color:#bbb;border-radius:12px;padding:12px;cursor:pointer}.nav:hover,.nav.active{background:rgba(255,107,0,.13);color:var(--o);outline:1px solid rgba(255,107,0,.25)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#111;border:1px solid var(--l);border-radius:16px;padding:16px}.stat b{display:block;font-size:34px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.sow{background:#161616;border:1px solid #2d2d2d;border-radius:14px;padding:14px;margin:10px 0}.tag{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;border:1px solid #444;color:#ccc}.green{color:var(--g);border-color:rgba(0,204,102,.45);background:rgba(0,204,102,.1)}.red{color:#ff8f8f;border-color:rgba(255,68,68,.45);background:rgba(255,68,68,.1)}.amber{color:#ffd08a;border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #2b2b2b;text-align:left}th{color:#aaa;background:#171717}.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.74);display:grid;place-items:center;z-index:9;padding:16px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto}.chatBtn{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--o),#ffaa00);font-size:24px;z-index:8}.chat{position:fixed;right:18px;bottom:88px;width:min(380px,calc(100vw - 36px));height:470px;background:#050505;border:1px solid var(--l);border-radius:18px;overflow:hidden;z-index:8;display:grid;grid-template-rows:auto 1fr auto}.chatH,.chatF{padding:12px;background:#111;border-bottom:1px solid var(--l)}.chatF{border-top:1px solid var(--l);border-bottom:0;display:flex;gap:8px}.chatF input{flex:1;background:#191919;border:1px solid var(--l);border-radius:10px;color:#fff;padding:10px}.msgs{overflow:auto;padding:12px}.msg{margin:9px 0;display:flex}.bubble{background:#151515;border:1px solid #303030;padding:10px 12px;border-radius:14px;white-space:pre-wrap;max-width:85%}.msg.user{justify-content:flex-end}.msg.user .bubble{background:linear-gradient(135deg,var(--o),#ffaa00);color:#000;border:0;font-weight:700}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.headIn{height:auto;padding:12px 0;gap:8px}.actions{display:grid}.small{width:100%}}
</style>
</head>
<body>
<section id="page-home" class="page active"><div class="home wrap"><div><div class="logo">TL</div><h1>TI-LEX <span class="accent">V10</span></h1><p>Agent intelligent québécois — boutons réparés, SOW, scans défensifs, paramètres.</p><div id="homeBtns" class="btns"><button class="btn secondary" onclick="showLogin()">Connexion</button><button class="btn primary" onclick="showRegister()">Inscription</button><button class="btn ghost" onclick="demo()">Entrer en mode démo</button></div><div id="login" class="card auth hidden"><h2>Connexion</h2><div id="loginMsg"></div><form onsubmit="login(event)"><div class="field"><label>Courriel</label><input id="loginEmail" type="email" required></div><div class="field"><label>Mot de passe</label><input id="loginPass" type="password" required></div><button class="btn primary">Se connecter</button></form><p><button class="small" onclick="home()">Retour</button> <button class="small" onclick="showRegister()">Créer compte</button></p></div><div id="register" class="card auth hidden"><h2>Inscription</h2><div id="regMsg"></div><form onsubmit="register(event)"><div class="field"><label>Nom</label><input id="regName" required></div><div class="field"><label>Courriel</label><input id="regEmail" type="email" required></div><div class="field"><label>Mot de passe</label><input id="regPass" type="password" minlength="8" required></div><button class="btn primary">Créer mon compte</button></form><p><button class="small" onclick="home()">Retour</button> <button class="small" onclick="showLogin()">Connexion</button></p></div></div></div></section>
<section id="page-dashboard" class="page"></section><section id="page-securite" class="page"></section><section id="page-agent" class="page"></section><section id="page-settings" class="page"></section><div id="modal"></div><button class="chatBtn" onclick="toggleChat()" id="chatBtn">💬</button><div id="chat" class="chat hidden"><div class="chatH"><b>TI-LEX Agent</b><br><small style="color:#888">Assistant local</small></div><div id="chatMsgs" class="msgs"></div><form class="chatF" onsubmit="sendChat(event)"><input id="chatInput" placeholder="Message..."><button class="small primary">➤</button></form></div>
<script>
(function(){
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('tilex-v10',JSON.stringify(S));const load=()=>{try{return JSON.parse(localStorage.getItem('tilex-v10'))}catch{return null}};let S=load()||{user:null,sows:[{id:'demo',title:'SOW démo légal',client:'Client Québec',status:'active',scopeIn:['example.com','api.example.com'],scopeOut:['prod.example.com'],types:['passive_recon'],exp:new Date(Date.now()+2592e6).toISOString()}],scans:[],cfg:{endpoint:'/api/chat',supabaseUrl:'',supabaseAnon:''}};let chatOpen=false;
function esc(x){let d=document.createElement('div');d.textContent=String(x??'');return d.innerHTML}function msg(id,t,c='ok'){let e=$(id);if(e)e.innerHTML=t?`<div class="alert ${c}">${esc(t)}</div>`:''}function tag(s){let m={active:['green','Actif'],draft:['amber','Brouillon'],revoked:['red','Révoqué'],completed:['green','Complété'],running:['amber','En cours']};let a=m[s]||['','—'];return `<span class="tag ${a[0]}">${a[1]}</span>`}function active(){return S.sows.filter(x=>x.status==='active')}function shell(tab,html){let u=S.user||{name:'Démo',email:'demo@ti-lex.local'};return `<header class="head"><div class="wrap headIn"><div class="brand"><div class="brandIcon">TL</div><div>ti-lex-v10<br><small style="color:#888">Québec · défensif</small></div></div><div style="text-align:right;color:#aaa">${esc(u.name)}<br><button class="small" onclick="logout()">Déconnexion</button></div></div></header><div class="wrap layout"><aside class="side"><button class="nav ${tab==='dashboard'?'active':''}" onclick="nav('dashboard')">🏠 Dashboard</button><button class="nav ${tab==='securite'?'active':''}" onclick="nav('securite')">🛡️ Sécurité</button><button class="nav ${tab==='agent'?'active':''}" onclick="nav('agent')">🤖 Agent</button><button class="nav ${tab==='settings'?'active':''}" onclick="nav('settings')">⚙️ Paramètres</button><p style="font-size:12px;color:#888">Scans simulés seulement, pour usage légal/autorisé.</p></aside><main>${html}</main></div>`}
function dashboard(){let run=S.scans.filter(x=>x.status==='running').length,done=S.scans.filter(x=>x.status==='completed').length,find=S.scans.reduce((n,x)=>n+(x.findings||0),0);$('page-dashboard').innerHTML=shell('dashboard',`<h2>Dashboard</h2><div class="grid"><div class="stat"><b>${active().length}</b><span>SOW actifs</span></div><div class="stat"><b>${run}</b><span>Scans en cours</span></div><div class="stat"><b>${done}</b><span>Scans finis</span></div><div class="stat"><b>${find}</b><span>Findings</span></div></div><div class="panel"><h3>Réparation</h3><p>Les boutons utilisent maintenant des handlers simples et une délégation <code>data-action</code>. Le bug de guillemets cassés est éliminé.</p><div class="actions"><button class="small primary" onclick="nav('securite')">Tester les boutons SOW</button><button class="small" onclick="nav('agent')">Ouvrir agent</button></div></div>`)}
function securite(){let opts=active().map(s=>`<option value="${s.id}">${esc(s.title)} — ${esc(s.client)}</option>`).join('');let sows=S.sows.map(s=>`<div class="sow"><b>${esc(s.title)}</b><p>${esc(s.client)} ${tag(s.status)}</p><p style="color:#aaa">Scope: ${s.scopeIn.map(esc).join(', ')||'—'}</p><div class="actions"><button class="small" data-action="activate" data-id="${s.id}">✅ Activer</button><button class="small danger" data-action="revoke" data-id="${s.id}">🚫 Révoquer</button><button class="small danger" data-action="delete" data-id="${s.id}">🗑️ Supprimer</button></div></div>`).join('')||'<p>Aucun SOW</p>';let scans=S.scans.map(x=>`<tr><td>${esc(x.target)}</td><td>${esc(x.type)}</td><td>${tag(x.status)}</td><td>${x.findings??'—'}</td></tr>`).join('')||'<tr><td colspan="4">Aucun scan</td></tr>';$('page-securite').innerHTML=shell('securite',`<h2>Sécurité</h2>${active().length?'':'<div class="alert err">Aucun SOW actif.</div>'}<div class="panel"><h3>Scan rapide</h3><form onsubmit="quickScan(event)"><div class="row"><div class="field"><label>Cible</label><input id="target" required placeholder="example.com"></div><div class="field"><label>Type</label><select id="stype"><option>passive_recon</option><option>audit_headers</option><option>tls_review</option></select></div><div class="field"><label>SOW</label><select id="scanSow" required><option value="">Choisir...</option>${opts}</select></div></div><button class="small primary">Lancer scan simulé</button></form><div id="scanMsg"></div></div><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><h3>SOW</h3><button class="small primary" onclick="showSow()">+ Nouveau SOW</button></div>${sows}</div><div class="panel"><h3>Historique</h3><table><thead><tr><th>Cible</th><th>Type</th><th>Statut</th><th>Findings</th></tr></thead><tbody>${scans}</tbody></table></div>`)}
function agent(){ $('page-agent').innerHTML=shell('agent',`<h2>Agent TI-LEX</h2><div class="panel"><div id="agentMsgs"><div class="msg"><div class="bubble">Salut Alex. Les boutons sont réparés. Demande-moi SOW, scan ou Loi 25.</div></div></div><form onsubmit="sendAgent(event)" class="actions"><input id="agentInput" style="flex:1;background:#191919;border:1px solid #333;color:#fff;border-radius:10px;padding:12px" placeholder="Message..."><button class="small primary">Envoyer</button></form><p><button class="small" onclick="agentAsk('sow')">sow</button> <button class="small" onclick="agentAsk('scan')">scan</button> <button class="small" onclick="agentAsk('loi 25')">loi 25</button></p></div>`)}
function settings(){ $('page-settings').innerHTML=shell('settings',`<h2>Paramètres</h2><div class="panel"><form onsubmit="saveCfg(event)"><div class="field"><label>Endpoint agent</label><input id="endpoint" value="${esc(S.cfg.endpoint)}"></div><div class="field"><label>Supabase URL</label><input id="surl" value="${esc(S.cfg.supabaseUrl)}"></div><div class="field"><label>Supabase anon publique</label><input id="sanon" value="${esc(S.cfg.supabaseAnon)}"></div><button class="small primary">Sauvegarder</button></form><div id="cfgMsg"></div></div>`)}
window.nav=function(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+p).classList.add('active');({dashboard,securite,agent,settings})[p]();scrollTo(0,0)};window.home=function(){$('homeBtns').classList.remove('hidden');$('login').classList.add('hidden');$('register').classList.add('hidden')};window.showLogin=function(){$('homeBtns').classList.add('hidden');$('login').classList.remove('hidden');$('register').classList.add('hidden')};window.showRegister=function(){$('homeBtns').classList.add('hidden');$('register').classList.remove('hidden');$('login').classList.add('hidden')};window.demo=function(){S.user={name:'Alex Marceau',email:'demo@ti-lex.local'};save();nav('dashboard')};window.login=function(e){e.preventDefault();S.user={name:$('loginEmail').value.split('@')[0],email:$('loginEmail').value};save();msg('loginMsg','Connexion réussie');nav('dashboard')};window.register=function(e){e.preventDefault();if($('regPass').value.length<8)return msg('regMsg','8 caractères minimum','err');S.user={name:$('regName').value,email:$('regEmail').value};save();msg('regMsg','Compte créé');nav('dashboard')};window.logout=function(){S.user=null;save();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-home').classList.add('active');home()};
window.showSow=function(){$('modal').innerHTML=`<div class="modalBg"><div class="card modal"><h2>Nouveau SOW</h2><form onsubmit="createSow(event)"><div class="field"><label>Titre</label><input id="sowTitle" required></div><div class="field"><label>Client</label><input id="sowClient" required></div><div class="field"><label>Scope autorisé, une cible par ligne</label><textarea id="sowScope" required placeholder="example.com"></textarea></div><div class="actions"><button class="small primary">Créer</button><button type="button" class="small" onclick="closeModal()">Annuler</button></div></form></div></div>`};window.closeModal=function(){$('modal').innerHTML=''};window.createSow=function(e){e.preventDefault();S.sows.unshift({id:crypto.randomUUID(),title:$('sowTitle').value,client:$('sowClient').value,status:'active',scopeIn:$('sowScope').value.split('\n').map(x=>x.trim()).filter(Boolean),scopeOut:[],types:['passive_recon'],exp:new Date(Date.now()+2592e6).toISOString()});save();closeModal();securite()};document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let s=S.sows.find(x=>x.id===b.dataset.id);if(!s)return;if(b.dataset.action==='activate')s.status='active';if(b.dataset.action==='revoke')s.status='revoked';if(b.dataset.action==='delete')S.sows=S.sows.filter(x=>x.id!==s.id);save();securite()});
window.quickScan=function(e){e.preventDefault();let s=S.sows.find(x=>x.id===$('scanSow').value&&x.status==='active'),t=$('target').value.trim();if(!s)return msg('scanMsg','Choisis un SOW actif','err');if(!s.scopeIn.some(x=>t===x||t.endsWith('.'+x)))return msg('scanMsg','Cible hors scope. Scan bloqué.','err');let scan={id:crypto.randomUUID(),target:t,type:$('stype').value,status:'running',findings:0};S.scans.unshift(scan);save();securite();setTimeout(()=>{let z=S.scans.find(x=>x.id===scan.id);if(z){z.status='completed';z.findings=Math.floor(Math.random()*4);save();securite();msg('scanMsg','Scan simulé terminé','ok')}},800)};
function reply(t){t=(t||'').toLowerCase();if(t.includes('sow'))return `Tu as ${S.sows.length} SOW, ${active().length} actif.`;if(t.includes('scan'))return 'Pour scanner: crée un SOW actif, mets la cible dans le scope, puis lance le scan simulé.';if(t.includes('loi'))return 'Loi 25: minimisation, consentement, journaux, protection des clés côté serveur.';return 'Je peux aider avec SOW, scan, paramètres et TI-LEX-V10.'}function add(box,role,text){let d=document.createElement('div');d.className='msg '+role;d.innerHTML=`<div class="bubble">${esc(text)}</div>`;box.appendChild(d);box.scrollTop=box.scrollHeight}window.agentAsk=function(t){$('agentInput').value=t;sendAgent(new Event('submit'))};window.sendAgent=function(e){e.preventDefault();let i=$('agentInput'),t=i.value.trim();if(!t)return;i.value='';let b=$('agentMsgs');add(b,'user',t);add(b,'agent',reply(t))};window.toggleChat=function(){chatOpen=!chatOpen;$('chat').classList.toggle('hidden',!chatOpen);$('chatBtn').textContent=chatOpen?'×':'💬';if(chatOpen&&!$('chatMsgs').dataset.ready){$('chatMsgs').dataset.ready=1;add($('chatMsgs'),'agent','Salut! Les boutons sont réparés.')}};window.sendChat=function(e){e.preventDefault();let i=$('chatInput'),t=i.value.trim();if(!t)return;i.value='';add($('chatMsgs'),'user',t);add($('chatMsgs'),'agent',reply(t))};window.saveCfg=function(e){e.preventDefault();S.cfg.endpoint=$('endpoint').value;S.cfg.supabaseUrl=$('surl').value;S.cfg.supabaseAnon=$('sanon').value;save();msg('cfgMsg','Paramètres sauvegardés')};dashboard();securite();agent();settings();if(S.user)nav('dashboard');
})();
</script>
</body>
</html>
