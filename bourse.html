<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ti-lex — Bourse 📈</title>
  <link rel="icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0a0a0a; --panel: #121214; --border: #232327;
      --txt: #e8e8f0; --muted: #8a8a96; --orange: #ff7f27;
      --green: #37e0a0; --red: #E60000;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--txt);
      font-family: var(--mono); -webkit-font-smoothing: antialiased;
      min-height: 100vh; padding: 24px 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
    header h1 .o { color: var(--orange); }
    header p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .search {
      display: flex; gap: 8px; margin-bottom: 22px;
    }
    .search input {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      color: var(--txt); font-family: var(--mono); font-size: 15px;
      padding: 13px 14px; border-radius: 10px; text-transform: uppercase;
    }
    .search input:focus { outline: none; border-color: var(--orange); }
    .search button {
      background: var(--orange); color: #0a0a0a; border: 0; font-weight: 700;
      font-family: var(--mono); font-size: 14px; padding: 0 20px;
      border-radius: 10px; cursor: pointer;
    }
    .search button:disabled { opacity: .5; cursor: default; }
    .hint { color: var(--muted); font-size: 12px; margin: -14px 0 22px; text-align: center; }
    .hint b { color: var(--orange); cursor: pointer; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    .quote-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .quote-sym { font-size: 20px; font-weight: 700; }
    .quote-name { color: var(--muted); font-size: 13px; }
    .quote-price { font-size: 30px; font-weight: 700; margin: 10px 0 4px; }
    .chg.up { color: var(--green); } .chg.down { color: var(--red); }
    .meta-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
    .meta-row b { color: var(--txt); font-weight: 600; }
    .prof-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; font-size: 13px; }
    .prof-grid .k { color: var(--muted); }
    .prof-desc { margin-top: 14px; font-size: 12.5px; line-height: 1.6; color: #c8c8d0; }
    .prof-site { margin-top: 10px; }
    .prof-site a { color: var(--orange); text-decoration: none; font-size: 12.5px; }
    .err { border-color: var(--red); color: #ffb3b3; }
    .loading { text-align: center; color: var(--muted); padding: 20px; }
    .disclaimer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; line-height: 1.5; }
    @media (max-width: 520px) { .prof-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ti-lex <span class="o">Bourse</span> 📈</h1>
      <p>Cours en temps réel et profils d'entreprises — Produit du Québec ⚜️</p>
    </header>

    <form class="search" id="form">
      <input id="sym" placeholder="Symbole boursier (ex: AAPL, TSLA, SHOP.TO)" autocomplete="off" autofocus />
      <button type="submit" id="go">Chercher</button>
    </form>
    <div class="hint">Essaie : <b data-s="AAPL">AAPL</b> · <b data-s="TSLA">TSLA</b> · <b data-s="MSFT">MSFT</b> · <b data-s="SHOP.TO">SHOP.TO</b></div>

    <div id="out"></div>

    <p class="disclaimer">Données fournies par Financial Modeling Prep via le proxy sécurisé ti-lex.<br>Informations à titre indicatif — ce ne sont pas des conseils financiers personnalisés.</p>
  </div>

  <script src="js/tilex-finance.js"></script>
  <script>
    (function () {
      "use strict";
      var form = document.getElementById("form");
      var input = document.getElementById("sym");
      var btn = document.getElementById("go");
      var out = document.getElementById("out");

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function num(x) { return (x == null || x === "") ? "—" : x; }

      async function chercher(symbole) {
        symbole = (symbole || "").trim().toUpperCase();
        if (!symbole) return;
        if (!window.TilexFinance) { out.innerHTML = '<div class="card err">Module bourse non chargé.</div>'; return; }
        input.value = symbole;
        btn.disabled = true;
        out.innerHTML = '<div class="loading">Chargement de ' + esc(symbole) + '…</div>';
        try {
          var cote = await window.TilexFinance.getQuote(symbole);
          if (cote && cote.erreur) { out.innerHTML = '<div class="card err">⚠ ' + esc(cote.erreur) + '</div>'; return; }

          var variation = Number(cote.variation);
          var pct = Number(cote.variationPct);
          var up = Number.isFinite(variation) ? variation >= 0 : true;
          var chgTxt = (Number.isFinite(variation) ? (up ? "+" : "") + variation.toFixed(2) : "—") +
            (Number.isFinite(pct) ? " (" + (up ? "+" : "") + pct.toFixed(2) + "%)" : "");

          var html = '<div class="card">' +
            '<div class="quote-top"><div><span class="quote-sym">' + esc(cote.symbole || symbole) + '</span> ' +
              '<span class="quote-name">' + esc(cote.nom || "") + '</span></div></div>' +
            '<div class="quote-price">' + num(cote.prix) + '</div>' +
            '<div class="chg ' + (up ? "up" : "down") + '">' + esc(chgTxt) + '</div>' +
            '<div class="meta-row"><span>Volume : <b>' + num(cote.volume) + '</b></span></div>' +
          '</div>';

          // Profil (best-effort — n'échoue pas la cotation si indispo)
          var p = await window.TilexFinance.getProfile(symbole);
          if (p && !p.erreur) {
            html += '<div class="card"><div class="prof-grid">' +
              '<div><span class="k">Secteur</span><br><b>' + esc(num(p.secteur)) + '</b></div>' +
              '<div><span class="k">Industrie</span><br><b>' + esc(num(p.industrie)) + '</b></div>' +
              '<div><span class="k">PDG</span><br><b>' + esc(num(p.pdg)) + '</b></div>' +
              '<div><span class="k">Employés</span><br><b>' + esc(num(p.employes)) + '</b></div>' +
              '</div>' +
              (p.description ? '<div class="prof-desc">' + esc(String(p.description).slice(0, 420)) + '…</div>' : '') +
              (p.site ? '<div class="prof-site">🔗 <a href="' + esc(p.site) + '" target="_blank" rel="noopener noreferrer">' + esc(p.site) + '</a></div>' : '') +
            '</div>';
          }
          out.innerHTML = html;
        } catch (e) {
          out.innerHTML = '<div class="card err">⚠ Erreur : ' + esc(e && e.message ? e.message : e) + '</div>';
        } finally {
          btn.disabled = false;
        }
      }

      form.addEventListener("submit", function (e) { e.preventDefault(); chercher(input.value); });
      document.querySelectorAll(".hint b").forEach(function (el) {
        el.addEventListener("click", function () { chercher(el.getAttribute("data-s")); });
      });
    })();
  </script>
</body>
</html>
