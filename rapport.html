<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 ti-lex Rapport de Saison</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a0f; color:#e8e8e8; min-height:100vh; padding-bottom:60px;
  }
  header { padding:18px 16px; background:#14141c; border-bottom:1px solid #26263a; text-align:center; }
  h1 { font-size:1.3rem; color:#ff3b3b; }
  .sub { color:#888; font-size:0.82rem; margin-top:3px; }

  .wrap { max-width:640px; margin:0 auto; padding:16px; }

  /* Grand total */
  .total {
    background:linear-gradient(135deg,#1a1a24,#14141c);
    border:1px solid #2ecc7155; border-radius:18px; padding:22px; margin-bottom:18px;
  }
  .total .t { color:#888; font-size:0.85rem; text-align:center; margin-bottom:14px; }
  .totgrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .totcase { text-align:center; padding:12px; background:#0d0d14; border-radius:12px; }
  .totcase .lbl { color:#888; font-size:0.75rem; margin-bottom:6px; }
  .totcase .big { font-size:1.7rem; font-weight:800; }
  .totcase.h .big { color:#fff; }
  .totcase.banque .big { color:#2ecc71; }
  .totcase.argent .big { color:#ffb300; }
  .totcase.cho .big { color:#3b82f6; font-size:1.3rem; }

  /* Tableau mois */
  .tablecard { background:#14141c; border:1px solid #26263a; border-radius:14px; overflow:hidden; margin-bottom:18px; }
  .tablecard h2 { padding:14px 16px; font-size:1rem; color:#ff3b3b; border-bottom:1px solid #26263a; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:11px 12px; text-align:right; font-size:0.85rem; }
  th { color:#888; font-weight:600; border-bottom:1px solid #26263a; background:#0d0d14; }
  th:first-child, td:first-child { text-align:left; }
  td { border-bottom:1px solid #1a1a24; }
  tr:last-child td { border-bottom:none; }
  td.mois { color:#fff; font-weight:600; text-transform:capitalize; }
  td.bk { color:#2ecc71; font-weight:600; }
  td.ar { color:#ffb300; font-weight:600; }
  tfoot td { background:#0d0d14; font-weight:800; color:#fff; border-top:2px solid #2ecc71; }

  /* Boutons */
  .actions { display:flex; gap:10px; }
  .actions button {
    flex:1; padding:15px; border:none; border-radius:12px; font-size:0.95rem;
    font-weight:700; cursor:pointer;
  }
  .pdf { background:#ff3b3b; color:#fff; }
  .print { background:#1e1e2a; color:#fff; }
  .vide { text-align:center; color:#666; padding:40px 20px; }

  @media print {
    body { background:#fff; color:#000; }
    header, .actions { display:none; }
    .total, .tablecard { border:1px solid #ccc; background:#fff; }
    .totcase, th { background:#f4f4f4; }
    .totcase .big, td.mois { color:#000 !important; }
  }
</style>
</head>
<body>

  <header>
    <h1>📊 RAPPORT DE SAISON</h1>
    <div class="sub" id="periode">Saison hiver — Alex Marceau-Prévost</div>
  </header>

  <div class="wrap">

    <!-- GRAND TOTAL -->
    <div class="total">
      <div class="t">🎯 TON BILAN AVANT LE CHÔMAGE</div>
      <div class="totgrid">
        <div class="totcase h"><div class="lbl">⏰ Heures totales</div><div class="big" id="tHeures">0</div></div>
        <div class="totcase banque"><div class="lbl">🏦 Banque d'heures</div><div class="big" id="tBanque">0</div></div>
        <div class="totcase argent"><div class="lbl">💰 Gains totaux</div><div class="big" id="tArgent">0$</div></div>
        <div class="totcase cho"><div class="lbl">📋 Chômage estimé/sem</div><div class="big" id="tChomage">--</div></div>
      </div>
    </div>

    <!-- TABLEAU PAR MOIS -->
    <div class="tablecard">
      <h2>📅 Détail mois par mois</h2>
      <table>
        <thead>
          <tr><th>Mois</th><th>Jours</th><th>Heures</th><th>Banque</th><th>Gains</th></tr>
        </thead>
        <tbody id="corps">
          <tr><td colspan="5" class="vide">Chargement...</td></tr>
        </tbody>
        <tfoot id="pied"></tfoot>
      </table>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="print" onclick="window.print()">🖨️ Imprimer</button>
      <button class="pdf" onclick="exportPDF()">📄 Exporter PDF</button>
    </div>

  </div>

<script src="js/tilex-config.js"></script>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Mêmes clés que les autres fichiers (anon JWT) → session partagée + RLS.
  const SUPABASE_URL = window.SB_URL || 'https://rnuripmfozlxenryxhdc.supabase.co';
  const SUPABASE_KEY = window.SB_ANON || '';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const MOIS_NOMS = ['','janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function nomMois(ym) {
    const [a, m] = ym.split('-');
    return MOIS_NOMS[parseInt(m)] + ' ' + a;
  }
  function argent(n) { return Math.round(n).toLocaleString('fr-CA') + ' $'; }
  function heures(n) { return (Math.round(n * 10) / 10) + 'h'; }

  // --- CHARGER LE RÉSUMÉ DEPUIS LA VUE SUPABASE ---
  async function charger() {
    const corps = document.getElementById('corps');

    // Sans session, la RLS renvoie 0 ligne → état vide propre.
    const { data: sess } = await supabase.auth.getSession();
    if (!sess || !sess.session) {
      corps.innerHTML = '<tr><td colspan="5" class="vide">🔒 Connecte-toi sur <a href="/pro" style="color:#ff7a00;">/pro</a> pour voir ton bilan.</td></tr>';
      return;
    }

    const { data, error } = await supabase
      .from('v_resume_saison')
      .select('*')
      .order('mois', { ascending: true });

    if (error || !data || !data.length) {
      corps.innerHTML = '<tr><td colspan="5" class="vide">📭 Aucune donnée de saison encore.<br>Remplis ton agenda pour voir ton bilan!</td></tr>';
      return;
    }

    let totH = 0, totB = 0, totA = 0, totJ = 0;
    corps.innerHTML = '';

    data.forEach(row => {
      totH += parseFloat(row.total_heures) || 0;
      totB += parseFloat(row.total_banque) || 0;
      totA += parseFloat(row.total_paye) || 0;
      totJ += parseInt(row.nb_jours) || 0;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mois">${nomMois(row.mois)}</td>
        <td>${row.nb_jours}</td>
        <td>${heures(row.total_heures)}</td>
        <td class="bk">${heures(row.total_banque)}</td>
        <td class="ar">${argent(row.total_paye)}</td>`;
      corps.appendChild(tr);
    });

    // Pied de tableau (totaux)
    document.getElementById('pied').innerHTML = `
      <tr>
        <td>TOTAL</td>
        <td>${totJ}</td>
        <td>${heures(totH)}</td>
        <td class="bk">${heures(totB)}</td>
        <td class="ar">${argent(totA)}</td>
      </tr>`;

    // Grand total en haut
    document.getElementById('tHeures').textContent = heures(totH);
    document.getElementById('tBanque').textContent = heures(totB);
    document.getElementById('tArgent').textContent = argent(totA);

    // Estimation chômage (~55% paye hebdo moyenne, plafond ~668$/sem 2026)
    const nbSemaines = Math.max(1, totJ / 5);
    const payeHebdo = totA / nbSemaines;
    const chomage = Math.min(Math.round(payeHebdo * 0.55), 668);
    document.getElementById('tChomage').textContent = chomage + ' $';
  }

  // --- EXPORT PDF (via impression navigateur) ---
  window.exportPDF = function() {
    window.print(); // "Enregistrer en PDF" dans la boîte d'impression
  };

  charger();
</script>
</body>
</html>
