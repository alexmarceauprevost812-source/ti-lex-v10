<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ti-lex — Chat</title>
<link rel="icon" href="/assets/tilex-logo.png">
<!--
  ti-lex-AL v10 — tilex-chat.html
  Interface DÉDIÉE au chat (juste du chat, rien d'autre). Deux familles :
    • Agent autonome AL — recherche web + images + vidéos + bourse : répond
      à TOUTES les questions (connaissances + actualité + données en direct).
    • Modèles directs Anthropic (Haiku / Sonnet / Opus) pour jaser avec le
      modèle brut, sans recherche web.

  Tout passe par l'edge function ai-proxy (clé Anthropic gérée côté serveur).
  Pas de Puter.ai, pas de ChatGPT (clé API séparée payante non configurée).
  Vanilla JS, zéro build, anti-XSS (on échappe avant tout rendu).
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0/dist/umd/supabase.min.js"></script>
<script src="/js/tilex-config.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg2:#0f0f13; --bg3:#17171c; --bg4:#1d1d24;
    --border:#23232c; --txt:#e7e7ee; --muted:#9a9aa5;
    --orange:#ff7f27; --vert:#37e0a0; --bleu:#4a9eff; --violet:#c700e6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--txt);
    font-family:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
    height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;}
  .shell{display:flex;height:100dvh;}

  /* ── Sidebar : agents ── */
  .sidebar{width:270px;flex:0 0 270px;background:var(--bg2);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow-y:auto;transition:transform .22s ease;}
  .sb-hd{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .sb-hd img{width:28px;height:28px;border-radius:7px;}
  .sb-hd .t{font-weight:800;font-size:14px;letter-spacing:.02em;}
  .sb-hd .t small{display:block;font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.06em;}
  .sb-new{margin:12px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg3);
    color:var(--txt);font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;}
  .sb-new:hover{border-color:var(--orange);color:var(--orange);}
  .grp-label{padding:12px 16px 5px;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .agent{margin:2px 10px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .12s;}
  .agent:hover{background:var(--bg3);}
  .agent.actif{background:rgba(255,127,39,.09);border-color:rgba(255,127,39,.32);}
  .agent .nom{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;}
  .agent .desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .agent .puce{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
  .agent-ava{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:0 0 22px;
    background:#000;box-shadow:0 0 0 1px rgba(255,90,31,.35);}
  .hd-ava{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 34px;background:#000;
    box-shadow:0 0 0 1px rgba(255,90,31,.4);}
  .ava.img{background:#000!important;padding:0;overflow:hidden;}
  .ava.img img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ── Zone chat ── */
  .zone{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-hd{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .burger{display:none;background:none;border:0;color:var(--txt);font-size:20px;cursor:pointer;padding:0;}
  .chat-hd .titre{font-weight:800;font-size:14px;}
  .chat-hd .sous{font-size:11px;color:var(--muted);}
  .messages{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px;}
  .rang{display:flex;gap:11px;max-width:820px;width:100%;margin:0 auto;}
  .rang.u{flex-direction:row-reverse;}
  .ava{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .ava.a{background:linear-gradient(135deg,#ff7f27,#c700e6);}
  .ava.u{background:var(--bg4);}
  .bulle{padding:11px 15px;border-radius:13px;font-size:14px;line-height:1.6;word-break:break-word;min-width:0;}
  .rang.u .bulle{background:var(--orange);color:#100800;}
  .rang.a .bulle{background:var(--bg3);border:1px solid var(--border);}
  .rang.a .bulle.err{border-color:#ff3a5c66;color:#ff8fa3;}
  .bulle p{margin:0 0 8px;} .bulle p:last-child{margin-bottom:0;}
  .bulle pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-size:12.5px;}
  .bulle code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12.5px;}
  .bulle pre code{background:none;border:0;padding:0;}
  .bulle a{color:var(--bleu);}
  .bulle ul,.bulle ol{margin:6px 0;padding-left:20px;} .bulle li{margin:2px 0;}
  .bulle strong{color:#fff;}
  .statut{font-size:11px;color:var(--muted);font-style:italic;margin:2px 0 0 41px;}
  .chip-web{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--bleu);
    border:1px solid rgba(74,158,255,.3);border-radius:20px;padding:2px 9px;margin:6px 0 0 41px;}
  .gal{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 41px;max-width:780px;}
  .gal a{display:block;width:120px;height:82px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .gal img{width:100%;height:100%;object-fit:cover;display:block;}
  .curseur{display:inline-block;width:7px;height:15px;background:var(--orange);border-radius:1px;
    vertical-align:text-bottom;animation:cli .9s steps(2) infinite;margin-left:2px;}
  @keyframes cli{50%{opacity:0;}}

  /* ── Saisie ── */
  .saisie{padding:14px 18px;border-top:1px solid var(--border);}
  .saisie-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
  .saisie textarea{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;color:var(--txt);font:inherit;font-size:14px;resize:none;max-height:160px;line-height:1.5;}
  .saisie textarea:focus{outline:none;border-color:var(--orange);}
  .saisie button{background:var(--orange);color:#100800;border:0;border-radius:12px;width:46px;height:46px;
    flex:0 0 46px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .saisie button:disabled{opacity:.45;cursor:not-allowed;}
  .saisie .avis{max-width:820px;margin:8px auto 0;font-size:10px;color:var(--muted);text-align:center;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5;}
  @media(max-width:760px){
    .sidebar{position:fixed;z-index:10;height:100dvh;transform:translateX(-100%);}
    .sidebar.ouverte{transform:translateX(0);}
    .burger{display:block;}
    .overlay.on{display:block;}
    .rang{max-width:100%;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="overlay" id="overlay" onclick="fermerSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sb-hd">
      <img src="/assets/tilex-logo.png" alt="ti-lex" onerror="this.style.display='none'">
      <div class="t">ti-lex Chat<small>Produit du Québec ⚜️</small></div>
    </div>
    <button class="sb-new" onclick="nouvelleConvo()">✚ Nouvelle conversation</button>
    <div id="liste-agents"></div>
  </nav>
  <main class="zone">
    <div class="chat-hd">
      <button class="burger" onclick="ouvrirSidebar()">☰</button>
      <img id="hd-ava" class="hd-ava" alt="" style="display:none" onerror="this.style.display='none'">
      <div>
        <div class="titre" id="hd-titre">Marceau</div>
        <div class="sous" id="hd-sous"></div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="saisie">
      <form class="saisie-inner" id="form" autocomplete="off">
        <textarea id="entree" rows="1" placeholder="Écris ton message…  (Entrée pour envoyer, Maj+Entrée = nouvelle ligne)" maxlength="6000"></textarea>
        <button type="submit" id="btn" title="Envoyer">➤</button>
      </form>
      <div class="avis" id="avis"></div>
    </div>
  </main>
</div>

<script>
/* =====================================================================
   1. AGENTS DISPONIBLES
   - Agent autonome : recherche web ON + toute la panoplie d'outils
     (images, vidéos, bourse) fournie automatiquement par ai-proxy →
     capable de répondre à TOUTES les questions, y compris l'actualité.
   - Modèles directs : le modèle brut d'Anthropic, sans recherche web.
   Modèles tirés de pro.html (#set-model / .csd-item / #se-model-agent).
   ===================================================================== */
var AGENTS = [
  { groupe:"Agent autonome", items:[
    { id:"marceau", nom:"Marceau", icone:"🔥", couleur:"#ff5a1f",
      avatar:"/assets/marceau-logo.png",
      desc:"Agent autonome capable de TOUT — recherche web, images, vidéos, bourse, sécurité. Les meilleures réponses, en direct.",
      autonome:true, model:"claude-opus-4-8",
      systeme:"Tu es Marceau, l'agent IA autonome de la plateforme ti-lex (Québec ⚜️). "
        +"Tu es capable de TOUT : tu réponds à n'importe quelle question avec la MEILLEURE réponse possible, "
        +"factuelle et à jour. Tu utilises tes outils de toi-même quand ça aide — recherche web pour l'actualité "
        +"et les faits récents, images/vidéos quand la personne veut VOIR quelque chose, cotations boursières en "
        +"direct, scans de sécurité. Tu ne dis jamais « je ne peux pas chercher » : tu cherches. "
        +"Tu donnes des réponses réelles, complètes et vérifiées — jamais d'invention ; si une info n'est pas "
        +"confirmée, tu le dis franchement.\n"
        +"Tu parles un français québécois naturel, chaleureux et DIRECT, comme un vrai chum qui connait la personne. "
        +"Tu vas droit au but, en paragraphes courts et aérés, avec des tournures d'ici (correc, en masse, pantoute, "
        +"checke ça) sans en beurrer épais. Tu utilises des listes seulement quand ça aide vraiment." },
    { id:"al-auto", nom:"Agent AL", icone:"⚡", couleur:"#37e0a0",
      desc:"L'agent AL classique — recherche web, images, vidéos, bourse, en direct.",
      autonome:true, model:"claude-sonnet-4-6" }
  ]},
  { groupe:"Modèles directs (sans web)", items:[
    { id:"claude-haiku-4-5-20251001", nom:"Claude Haiku 4.5", icone:"⚡", couleur:"#4a9eff",
      desc:"Le plus rapide. Idéal pour des réponses courtes." },
    { id:"claude-sonnet-4-6", nom:"Claude Sonnet 4.6", icone:"◆", couleur:"#ff7f27",
      desc:"Équilibré — le bon défaut pour la plupart des tâches." },
    { id:"claude-opus-4-8", nom:"Claude Opus 4.8", icone:"★", couleur:"#c700e6",
      desc:"Le plus puissant. Raisonnement et tâches complexes." }
  ]}
];
var AGENT_DEFAUT = "marceau";

/* =====================================================================
   2. ÉTAT
   ===================================================================== */
var agentActif = null;
var historique = [];
var enCours = false;

function trouverAgent(id){
  for (var g=0;g<AGENTS.length;g++)
    for (var i=0;i<AGENTS[g].items.length;i++)
      if (AGENTS[g].items[i].id===id) return AGENTS[g].items[i];
  return AGENTS[0].items[0];
}

/* =====================================================================
   3. SIDEBAR
   ===================================================================== */
function construireSidebar(){
  var box = document.getElementById('liste-agents');
  box.innerHTML='';
  AGENTS.forEach(function(grp){
    var lbl=document.createElement('div');lbl.className='grp-label';lbl.textContent=grp.groupe;box.appendChild(lbl);
    grp.items.forEach(function(a){
      var el=document.createElement('div');
      el.className='agent'+(a.id===agentActif?' actif':'');
      el.dataset.id=a.id;
      var nom=document.createElement('div');nom.className='nom';
      if(a.avatar){
        var av=document.createElement('img');av.className='agent-ava';av.src=a.avatar;av.alt='';
        av.onerror=function(){this.style.display='none';};
        nom.appendChild(av);nom.appendChild(document.createTextNode(a.nom));
      } else {
        var puce=document.createElement('span');puce.className='puce';puce.style.background=a.couleur;
        nom.appendChild(puce);nom.appendChild(document.createTextNode(a.icone+' '+a.nom));
      }
      var desc=document.createElement('div');desc.className='desc';desc.textContent=a.desc;
      el.appendChild(nom);el.appendChild(desc);
      el.addEventListener('click',function(){choisirAgent(a.id);fermerSidebar();});
      box.appendChild(el);
    });
  });
}
function choisirAgent(id){
  agentActif=id;
  try{ localStorage.setItem('tilex-chat-agent',id); }catch(e){}
  document.querySelectorAll('.agent').forEach(function(el){el.classList.toggle('actif',el.dataset.id===id);});
  var a=trouverAgent(id);
  var hdAva=document.getElementById('hd-ava');
  if(a.avatar){ hdAva.src=a.avatar; hdAva.style.display='block'; } else { hdAva.style.display='none'; }
  document.getElementById('hd-titre').textContent=(a.avatar?'':a.icone+' ')+a.nom;
  document.getElementById('hd-sous').textContent=a.autonome?'Recherche web active — pose n\'importe quelle question':'Modèle direct — connaissances du modèle';
  document.getElementById('avis').textContent=a.autonome
    ? 'Agent autonome : recherche web + images + vidéos + bourse. Peut se tromper — vérifie l\'important.'
    : 'Modèle '+a.id+' — sans recherche web. Peut se tromper.';
}

/* =====================================================================
   4. RENDU MARKDOWN SÉCURITAIRE (on échappe AVANT toute mise en forme)
   ===================================================================== */
function echapper(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function rendreMd(txt){
  var blocs=[];
  var s=echapper(txt);
  // blocs de code ```…```
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,function(m,lang,code){
    blocs.push('<pre><code>'+code.replace(/\n$/,'')+'</code></pre>');
    return '␀B'+(blocs.length-1)+'␀';
  });
  // code en ligne `…`
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  // liens [txt](url) — seulement http/https
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // listes + paragraphes
  var lignes=s.split('\n'), out=[], enListe=false, typeListe='';
  for (var i=0;i<lignes.length;i++){
    var l=lignes[i];
    if (/^␀B\d+␀$/.test(l.trim())){ if(enListe){out.push(typeListe==='ul'?'</ul>':'</ol>');enListe=false;} out.push(l.trim()); continue; }
    var mu=l.match(/^[-*]\s+(.+)$/), mo=l.match(/^\d+\.\s+(.+)$/);
    if (mu){ if(enListe&&typeListe!=='ul'){out.push('</ol>');enListe=false;} if(!enListe){out.push('<ul>');enListe=true;typeListe='ul';} out.push('<li>'+mu[1]+'</li>'); continue; }
    if (mo){ if(enListe&&typeListe!=='ol'){out.push('</ul>');enListe=false;} if(!enListe){out.push('<ol>');enListe=true;typeListe='ol';} out.push('<li>'+mo[1]+'</li>'); continue; }
    if (enListe){out.push(typeListe==='ul'?'</ul>':'</ol>');enListe=false;}
    if (l.trim()==='') out.push(''); else out.push('<p>'+l+'</p>');
  }
  if (enListe) out.push(typeListe==='ul'?'</ul>':'</ol>');
  var html=out.join('\n');
  html=html.replace(/␀B(\d+)␀/g,function(m,n){return blocs[+n];});
  return html;
}

/* =====================================================================
   5. AFFICHAGE
   ===================================================================== */
function ajouterRang(role){
  var wrap=document.getElementById('messages');
  var rang=document.createElement('div');rang.className='rang '+role;
  var ava=document.createElement('div');ava.className='ava '+role;
  var actif=trouverAgent(agentActif);
  if(role==='a'&&actif.avatar){
    ava.classList.add('img');
    var im=document.createElement('img');im.src=actif.avatar;im.alt='';
    im.onerror=function(){this.parentNode.textContent=actif.icone||'⚡';};
    ava.appendChild(im);
  } else { ava.textContent=role==='u'?'🧑':(actif.icone||'⚡'); }
  var col=document.createElement('div');col.style.minWidth='0';col.style.flex='1';
  var bulle=document.createElement('div');bulle.className='bulle';
  col.appendChild(bulle);
  rang.appendChild(ava);rang.appendChild(col);
  wrap.appendChild(rang);
  wrap.scrollTop=wrap.scrollHeight;
  return { rang:rang, col:col, bulle:bulle };
}
function scrollBas(){ var m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }

/* =====================================================================
   6. ENVOI — ai-proxy (streaming SSE)
   ===================================================================== */
var _sb=null;
function clientSupabase(){
  if(_sb) return _sb;
  if(!window.supabase||typeof window.supabase.createClient!=='function') return null;
  _sb=window.supabase.createClient(window.SB_URL,window.SB_ANON);return _sb;
}
async function recupererToken(){
  try{ var sb=clientSupabase(); if(!sb) return null;
    var r=await sb.auth.getSession(); return r&&r.data&&r.data.session?r.data.session.access_token:null;
  }catch(e){ return null; }
}

async function envoyer(texte){
  var a=trouverAgent(agentActif);
  historique.push({ role:'user', content:texte });
  var m=ajouterRang('a');
  var bulle=m.bulle, col=m.col;
  bulle.innerHTML='<span class="curseur"></span>';
  var accumule='', statutEl=null;

  function poserStatut(txt){
    if(!statutEl){ statutEl=document.createElement('div');statutEl.className='statut';col.appendChild(statutEl); }
    statutEl.textContent=txt;
  }
  function enleverStatut(){ if(statutEl){statutEl.remove();statutEl=null;} }

  try{
    var token=await recupererToken();
    var headers={ 'Content-Type':'application/json' };
    if(token) headers['Authorization']='Bearer '+token;
    var corps={ kind:'chat', model:a.model||a.id, max_tokens:4096, messages:historique.slice(-40) };
    if(a.autonome) corps.web_search=true;
    if(a.systeme) corps.system=a.systeme;

    var res=await fetch(window.AI_PROXY,{ method:'POST', headers:headers, body:JSON.stringify(corps) });
    if(!res.ok){
      var em='Erreur '+res.status;
      try{ var j=await res.json(); em=j.error||em; }catch(e){}
      bulle.classList.add('err');bulle.textContent='⚠️ '+em;historique.pop();return;
    }

    var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
    while(true){
      var ch=await reader.read();
      if(ch.done) break;
      buf+=dec.decode(ch.value,{stream:true});
      var lignes=buf.split('\n'); buf=lignes.pop()||'';
      for(var i=0;i<lignes.length;i++){
        var t=lignes[i].trim();
        if(!t.startsWith('data:')) continue;
        var p=t.slice(5).trim();
        if(!p||p==='[DONE]') continue;
        var evt; try{ evt=JSON.parse(p); }catch(e){ continue; }

        if(evt.type==='content_block_delta'&&evt.delta&&evt.delta.text){
          enleverStatut();
          accumule+=evt.delta.text;
          bulle.innerHTML=rendreMd(accumule)+'<span class="curseur"></span>';
          scrollBas();
        } else if(evt.type==='tool_status'){
          var noms={ web_search:'🌐 Recherche web…', recherche_media:'🖼️ Recherche d\'images…',
            recherche_youtube:'🎬 Recherche de vidéos…', get_stock_quote:'📈 Cotation boursière…',
            get_company_profile:'📈 Profil d\'entreprise…', lancer_scan_securite:'🔰 Scan de sécurité…' };
          poserStatut(noms[evt.tool_name]||('🔧 '+evt.tool_name+'…'));
        } else if(evt.type==='sources'&&evt.sources&&evt.sources.indexOf('web')!==-1){
          if(!col.querySelector('.chip-web')){ var c=document.createElement('div');c.className='chip-web';c.textContent='🌐 Sources web';col.appendChild(c); }
        } else if(evt.type==='media'&&evt.items&&evt.items.length){
          afficherGalerie(col,evt.items,false);
        } else if(evt.type==='youtube'&&evt.items&&evt.items.length){
          afficherGalerie(col,evt.items,true);
        }
      }
    }
    enleverStatut();
    if(!accumule.trim()){ bulle.textContent='(réponse vide)'; }
    else{ bulle.innerHTML=rendreMd(accumule); historique.push({ role:'assistant', content:accumule }); }
    scrollBas();
  }catch(e){
    enleverStatut();
    bulle.classList.add('err');bulle.textContent='⚠️ Erreur de connexion : '+e.message;historique.pop();
  }
}

/* Galerie d'images / vidéos (miniatures) — anti-XSS : URLs https only, DOM pur */
function afficherGalerie(col, items, estYoutube){
  var gal=document.createElement('div');gal.className='gal';
  items.slice(0,8).forEach(function(it){
    var thumb=estYoutube?it.thumb:it.thumb;
    var lien=estYoutube?('https://www.youtube.com/watch?v='+(it.videoId||'')):(it.link||it.full);
    if(typeof thumb!=='string'||!/^https:\/\//.test(thumb)) return;
    if(typeof lien!=='string'||!/^https:\/\//.test(lien)) return;
    var a=document.createElement('a');a.href=lien;a.target='_blank';a.rel='noopener';
    var img=document.createElement('img');img.src=thumb;img.loading='lazy';img.alt='';
    a.appendChild(img);gal.appendChild(a);
  });
  if(gal.children.length) col.appendChild(gal);
  scrollBas();
}

   7. UI

function nouvelleConvo(){
  historique=[];
  document.getElementById('messages').innerHTML='';
  var a=trouverAgent(agentActif);
  var m=ajouterRang('a');
  var accueil;
  if(a.id==='marceau')
    accueil="Salut ! Moi c'est **Marceau** 🔥 — ton agent autonome capable de **tout**. "
      +"Pose-moi n'importe quelle question : je cherche sur le web pour l'actualité, je trouve des images pis des vidéos, "
      +"je sors des cours de bourse en direct, je scanne la sécurité. Je te donne toujours la **meilleure réponse réelle**. Vas-y, envoye !";
  else if(a.autonome)
    accueil="Salut ! Moi c'est **AL**, ton agent autonome. Pose-moi n'importe quelle question — je peux chercher sur le web, trouver des images et des vidéos, sortir des cours de bourse en direct. Vas-y !";
  else
    accueil="Salut ! Tu jases avec **"+a.nom+"** en direct (sans recherche web). Qu'est-ce que je peux faire pour toi ?";
  m.bulle.innerHTML=rendreMd(accueil);
}
function ouvrirSidebar(){ document.getElementById('sidebar').classList.add('ouverte'); document.getElementById('overlay').classList.add('on'); }
function fermerSidebar(){ document.getElementById('sidebar').classList.remove('ouverte'); document.getElementById('overlay').classList.remove('on'); }

var entree=document.getElementById('entree');
entree.addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,160)+'px'; });
entree.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('form').dispatchEvent(new Event('submit',{cancelable:true})); }
});
document.getElementById('form').addEventListener('submit',async function(e){
  e.preventDefault();
  if(enCours) return;
  var txt=entree.value.trim(); if(!txt) return;
  entree.value='';entree.style.height='auto';
  var u=ajouterRang('u'); u.bulle.textContent=txt;
  enCours=true; document.getElementById('btn').disabled=true;
  try{ await envoyer(txt); }
  finally{ enCours=false; document.getElementById('btn').disabled=false; entree.focus(); }
});

/* Init */
(function(){
  var sauve=null; try{ sauve=localStorage.getItem('tilex-chat-agent'); }catch(e){}
  agentActif = (sauve && trouverAgent(sauve).id===sauve) ? sauve : AGENT_DEFAUT;
  construireSidebar();
  choisirAgent(agentActif);
  nouvelleConvo();
})();
