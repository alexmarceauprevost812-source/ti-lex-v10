<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti-lex — Abonnement</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--orange:#ff7f27;--muted:#4a4a5a;--txt:#e8e8ee;--border:#23232c;--green:#37e0a0;--red:#e60000;--font:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{background:#0d0d14;border:1px solid var(--border);border-radius:16px;padding:40px 32px;max-width:440px;width:100%;text-align:center;}
.logo{width:54px;height:54px;border-radius:12px;margin:0 auto 18px;background:linear-gradient(135deg,var(--orange),#e63600);display:flex;align-items:center;justify-content:center;font-size:26px;}
h1{font-size:18px;letter-spacing:1px;margin-bottom:6px;}
.plan-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;background:rgba(255,127,39,.12);color:var(--orange);border:1px solid rgba(255,127,39,.3);margin-bottom:22px;text-transform:uppercase;}
.status{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,127,39,.2);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px;}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;padding:12px 28px;border-radius:10px;font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.8px;cursor:pointer;text-decoration:none;border:none;transition:all .18s;}
.btn-orange{background:var(--orange);color:#000;}
.btn-orange:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:10px;}
.btn-ghost:hover{color:var(--txt);border-color:var(--txt);}
.err{color:var(--red);font-size:12px;margin-bottom:16px;line-height:1.5;}
.ok{color:var(--green);font-size:12px;margin-bottom:16px;}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>
  <h1>Abonnement <b id="titre-plan">ti-lex</b></h1>
  <div class="plan-badge" id="badge-plan">CHARGEMENT</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Vérification de ta session…</div>
  <div class="btns" id="btns" style="display:none"></div>
</div>

<script src="/js/tilex-config.js"></script>
<script>
var PLAN_NOMS = {
  ti: 'TI',
  surge: 'TI-LEX',
  apex: 'TI-LEX-AL',
  cyber_recon: 'CYBER RECON',
  cyber_guardian: 'CYBER GUARDIAN',
  cyber_sentinel: 'CYBER SENTINEL'
};

var PLAN_PRICES = {
  ti:              'price_1Tk0ylFu0d9mAEdCMHuDGik6',
  surge:           'price_1Tk1BqFu0d9mAEdC1Ti7zHG0',
  apex:            'price_1Tk1O3Fu0d9mAEdCbKUV25kJ',
  cyber_recon:     'price_1TiNFrFu0d9mAEdCDOok74WK',
  cyber_guardian:  'price_1TiUGRFu0d9mAEdCl3S7d8Hz',
  cyber_sentinel:  'price_1TiNS9Fu0d9mAEdC3YfrwmWl'
};

function el(id){ return document.getElementById(id); }

function setStatus(txt, isErr){
  el('status').textContent = txt;
  el('status').style.color = isErr ? 'var(--red)' : 'var(--muted)';
}

function showBtns(html){
  el('spinner').style.display = 'none';
  el('btns').style.display = 'flex';
  el('btns').innerHTML = html;
}

function plan(){
  var p = new URLSearchParams(location.search).get('plan') || '';
  return p.toLowerCase().replace(/[^a-z_]/g,'');
}

(async function(){
  var planId = plan();
  var nom = PLAN_NOMS[planId] || planId.toUpperCase() || '?';
  el('titre-plan').textContent = nom;
  el('badge-plan').textContent = nom;

  if(!planId || !PLAN_PRICES[planId]){
    el('spinner').style.display = 'none';
    setStatus('Forfait inconnu. Choisis un forfait dans la liste.', true);
    showBtns('<a href="/forfaits" class="btn btn-orange">Voir les forfaits</a>');
    return;
  }

  if(!window.SB_URL || !window.SB_ANON){
    el('spinner').style.display = 'none';
    setStatus('Configuration absente.', true);
    return;
  }

  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  script.onerror = function(){
    el('spinner').style.display = 'none';
    setStatus('Impossible de charger Supabase. Vérifie ta connexion.', true);
  };
  script.onload = async function(){
    var sb = window.supabase.createClient(window.SB_URL, window.SB_ANON);
    var session = await sb.auth.getSession();
    var token = session.data && session.data.session ? session.data.session.access_token : null;

    if(!token){
      el('spinner').style.display = 'none';
      setStatus('Tu dois te connecter à ti-lex avant de t\'abonner.');
      showBtns(
        '<a href="/pro.html" class="btn btn-orange">Me connecter</a>' +
        '<a href="/forfaits" class="btn btn-ghost">Retour aux forfaits</a>'
      );
      return;
    }

    setStatus('Création de ta session Stripe…');
    try{
      var priceId = PLAN_PRICES[planId];
      var res = await fetch(window.SB_URL + '/functions/v1/create-checkout', {
        method: 'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + token,
          'apikey': window.SB_ANON
        },
        body: JSON.stringify({ priceId: priceId })
      });
      var data = await res.json();

      if(res.status === 403){
        el('spinner').style.display = 'none';
        setStatus(data.error || 'Ce forfait n\'est pas encore disponible.', true);
        showBtns('<a href="/forfaits" class="btn btn-orange">Retour aux forfaits</a>');
        return;
      }

      if(!res.ok || !data.url){
        throw new Error(data.error || 'Réponse invalide du serveur');
      }

      setStatus('Redirection vers le paiement sécurisé…');
      window.location.href = data.url;

    }catch(e){
      el('spinner').style.display = 'none';
      setStatus('Erreur : ' + e.message, true);
      showBtns(
        '<button onclick="location.reload()" class="btn btn-orange">Réessayer</button>' +
        '<a href="/forfaits" class="btn btn-ghost">Retour aux forfaits</a>'
      );
    }
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
