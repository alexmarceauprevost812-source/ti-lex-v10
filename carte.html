<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🗺️ TILEXMAP — carte du Québec</title>
<link rel="manifest" href="/manifest.json">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--or:#ff7a00;--rouge:#ff2d2d;--bleu:#2a7cff;--vertf:#1f7a3d;--bg:#07070b;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  #map{position:absolute;inset:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#eee;}

  /* Barre du haut */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;
    background:linear-gradient(180deg,rgba(7,7,11,.92),rgba(7,7,11,0));pointer-events:none;}
  .topbar>*{pointer-events:auto;}
  .tb-btn{width:40px;height:40px;border-radius:12px;border:none;background:rgba(20,20,26,.9);color:#eee;
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .tb-btn:active{transform:scale(.92);}
  .tb-titre{flex:1;font-weight:800;font-size:15px;color:var(--or);text-shadow:0 1px 6px #000;letter-spacing:.3px;}

  /* Boutons flottants droite */
  .fab-col{position:absolute;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:10;
    display:flex;flex-direction:column;gap:10px;}
  .fab{width:48px;height:48px;border-radius:50%;border:none;background:rgba(20,20,26,.92);color:#eee;
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.55);transition:transform .1s;}
  .fab:active{transform:scale(.9);}
  .fab.on{background:var(--or);color:#000;}

  /* Barre du bas : outils */
  .toolbar{position:absolute;left:0;right:0;bottom:0;z-index:10;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,rgba(7,7,11,.94),rgba(7,7,11,0));
    display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tool{flex:0 0 auto;background:rgba(20,20,26,.92);border:1px solid #2a2a34;color:#eee;border-radius:22px;
    padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .tool.on{background:var(--or);color:#000;border-color:var(--or);}
  .tool:active{transform:scale(.96);}

  /* Bandeau mode dessin */
  .draw-bar{position:absolute;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:11;
    background:rgba(15,15,20,.96);border:1px solid var(--or);border-radius:14px;padding:11px 13px;display:none;
    align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.6);}
  .draw-bar.on{display:flex;}
  .draw-bar .db-txt{flex:1;font-size:12.5px;color:#eee;line-height:1.35;}
  .draw-bar .db-txt b{color:var(--or);}
  .draw-bar button{border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer;}
  .db-annuler{background:#2a2a34;color:#bbb;}
  .db-ok{background:var(--or);color:#000;}

  /* Feuille modale (nommer un chemin, POIs…) */
  .voile{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;}
  .voile.on{display:block;}
  .feuille{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#14141a;border-radius:20px 20px 0 0;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -8px 30px rgba(0,0,0,.6);}
  .feuille.on{display:block;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .feuille h3{font-size:16px;margin-bottom:12px;color:var(--or);}
  .feuille label{display:block;font-size:11px;color:#9a9aa5;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px;}
  .feuille input,.feuille select{width:100%;background:#0d0d13;border:1px solid #2a2a34;color:#eee;
    border-radius:10px;padding:12px;font-size:15px;}
  .feuille .row{display:flex;gap:10px;}
  .feuille .row>*{flex:1;}
  .feuille .actions{display:flex;gap:10px;margin-top:16px;}
  .feuille .actions button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;}
  .b-annul{background:#2a2a34;color:#bbb;}.b-ok{background:var(--or);color:#000;}

  .toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    background:rgba(20,20,26,.96);border:1px solid var(--or);color:#eee;border-radius:20px;padding:9px 16px;
    font-size:13px;font-weight:700;z-index:30;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.5);}

  .maplibregl-ctrl-attrib{font-size:9px;opacity:.5;}
  .popup{font-size:13px;color:#111;}
  .popup b{color:#000;}

  /* Légende */
  .legende{position:absolute;left:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:12;
    width:196px;background:rgba(15,15,20,.95);border:1px solid #2a2a34;border-radius:14px;padding:11px 13px;
    box-shadow:0 8px 30px rgba(0,0,0,.55);font-size:12px;display:none;}
  .legende.on{display:block;}
  .lg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .lg-head span{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#9a9aa5;font-weight:700;}
  .lg-head button{background:none;border:none;color:#9a9aa5;font-size:14px;cursor:pointer;}
  .lg-row{display:flex;align-items:center;gap:9px;margin:7px 0;color:#eee;}
  .lg-row .sw{width:22px;height:0;border-top-width:4px;border-top-style:solid;border-radius:2px;flex:0 0 auto;}
  .lg-foot{margin-top:9px;color:#9a9aa5;font-size:10.5px;line-height:1.4;}

  /* Spinner */
  .busy{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    z-index:13;background:rgba(15,15,20,.96);border:1px solid #2a2a34;border-radius:20px;padding:8px 15px;
    font-size:12px;color:#eee;display:none;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.5);}
  .busy.on{display:flex;}
  .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--or);
    border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* Feuille info (bottom sheet) */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:22;background:#14141a;
    border-radius:20px 20px 0 0;border-top:1px solid #2a2a34;box-shadow:0 -10px 40px rgba(0,0,0,.6);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:74vh;overflow-y:auto;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));}
  .sheet.on{transform:translateY(0);}
  .sheet-grab{width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.25);margin:10px auto 6px;}
  .sheet-x{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.08);border:none;color:#eee;
    width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;z-index:2;}
  .sheet h2{font-size:19px;margin:4px 0 2px;color:#fff;}
  .sheet .s-type{color:var(--or);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .sheet .s-row{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-size:14px;color:#eee;}
  .sheet .s-row .k{color:#9a9aa5;min-width:22px;text-align:center;}
  .sheet a{color:#7fd1ff;text-decoration:none;}
  .s-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .s-chip{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(31,122,61,.22);
    border:1px solid rgba(31,122,61,.5);color:#bff3d2;}
  .s-chip.warn{background:rgba(255,122,0,.15);border-color:rgba(255,122,0,.45);color:#ffd9ad;}
  .s-sect{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;}
  .s-sect h3{margin:0 0 6px;font-size:13px;letter-spacing:.4px;color:#9a9aa5;text-transform:uppercase;}
  .s-note{font-size:12px;color:#9a9aa5;line-height:1.45;background:rgba(255,255,255,.04);
    border:1px dashed rgba(255,255,255,.14);border-radius:10px;padding:9px 11px;margin-top:8px;}
  .s-actions{display:flex;gap:8px;margin-top:14px;}
  .s-actions a{flex:1;text-align:center;border-radius:12px;padding:11px;font-weight:700;font-size:14px;
    border:1px solid #2a2a34;background:rgba(255,255,255,.06);color:#eee;text-decoration:none;}
  .s-actions a.go{background:linear-gradient(135deg,var(--vertf),#155a2c);border:none;color:#fff;}
</style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <button class="tb-btn" onclick="location.href='/pro'" title="Retour">←</button>
    <span class="tb-titre">🗺️ TILEXMAP</span>
    <button class="tb-btn" id="btn-theme" title="Thème jour/nuit">🌙</button>
    <button class="tb-btn" id="btn-legende" title="Légende">🗺️</button>
    <button class="tb-btn" id="btn-recherche" title="Chercher un lieu">🔍</button>
  </div>

  <!-- Légende des couleurs de chemins -->
  <aside class="legende" id="legende">
    <div class="lg-head"><span id="lg-titre">Thème nuit</span><button id="lg-fermer">✕</button></div>
    <div id="lg-items"></div>
    <div class="lg-foot">Chemins forestiers 🌲 + pourvoiries via OpenStreetMap. Zoome pour plus de détails.</div>
  </aside>

  <!-- Spinner de chargement (recherche POI / hors-ligne) -->
  <div class="busy" id="busy"><span class="spin"></span><span id="busy-txt">Chargement…</span></div>

  <!-- Feuille info pourvoirie / POI -->
  <div class="sheet" id="sheet">
    <button class="sheet-x" id="sheet-x">✕</button>
    <div class="sheet-grab"></div>
    <div id="sheet-body"></div>
  </div>

  <div class="fab-col">
    <button class="fab" id="fab-loc" title="Ma position">📍</button>
    <button class="fab" id="fab-nord" title="Recentrer nord">🧭</button>
  </div>

  <div class="draw-bar" id="draw-bar">
    <span class="db-txt" id="db-txt">✏️ <b>Tracer</b> : touche la carte pour ajouter des points. <span id="db-km">0.0 km</span></span>
    <button class="db-annuler" id="db-annuler">Annuler</button>
    <button class="db-ok" id="db-ok">Terminer</button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="tool" id="t-tracer">✏️ Tracer un chemin</button>
    <button class="tool" id="t-live">🔴 Tracé live</button>
    <button class="tool" id="t-pont">🌉 Ajouter un pont</button>
    <button class="tool" id="t-pourvoirie">🎣 Pourvoiries</button>
    <button class="tool" id="t-gaz" data-poi="fuel">⛽ Gaz</button>
    <button class="tool" id="t-banque" data-poi="bank">🏦 Banque</button>
    <button class="tool" id="t-dep" data-poi="convenience">🏪 Dépanneur</button>
    <button class="tool" id="t-resto" data-poi="restaurant">🍔 Resto</button>
    <button class="tool" id="t-partage">📤 Partager</button>
    <button class="tool" id="t-offline">⬇️ Hors-ligne</button>
  </div>

  <!-- Feuille : nommer un chemin -->
  <div class="voile" id="voile"></div>
  <div class="feuille" id="f-chemin">
    <h3>🌲 Nouveau chemin forestier</h3>
    <label>Nom du chemin</label>
    <input id="ch-nom" type="text" placeholder="Ex: Chemin R1010, Chemin du Lac Vert…">
    <div class="row">
      <div><label>Type</label>
        <select id="ch-type"><option value="forestier">Forestier</option><option value="principal">Principal</option><option value="secondaire">Secondaire</option></select></div>
      <div><label>Vitesse (km/h)</label>
        <input id="ch-vit" type="number" inputmode="numeric" placeholder="50"></div>
    </div>
    <div class="actions"><button class="b-annul" id="ch-annul">Annuler</button><button class="b-ok" id="ch-ok">💾 Sauvegarder</button></div>
  </div>

  <!-- Feuille : nommer un pont/point -->
  <div class="feuille" id="f-point">
    <h3 id="fp-titre">🌉 Nouveau pont</h3>
    <label>Nom (optionnel)</label>
    <input id="pt-nom" type="text" placeholder="Ex: Pont rivière aux Castors">
    <div class="actions"><button class="b-annul" id="pt-annul">Annuler</button><button class="b-ok" id="pt-ok">💾 Sauvegarder</button></div>
  </div>

  <script src="/js/tilex-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
  (function(){
  'use strict';
  /* ════════════════════════════════════════════════════════════
     TILEXMAP — carte du Québec/Canada style Google Maps, sauce ti-lex.
     • MapLibre GL + tuiles vectorielles OpenFreeMap (GRATUIT, sans clé).
     • Thème NUIT : fond noir, routes principales orange, chemins
       forestiers ROUGE avec effet « courant » animé + texte blanc brillant.
     • Thème JOUR : fond beige (style Claude), principales bleu,
       forestiers vert foncé, texte noir.
     • Géolocalisation live (ta position, suivi). Bornes kilométriques
       (km 34) sur les chemins forestiers. Ponts. POIs (gaz, banque,
       dépanneur, resto) via Overpass. Mode « tracer un chemin ».
     • Données forestières sauvées dans Supabase (carte communautaire).
     ════════════════════════════════════════════════════════════ */

  var SB = (window.supabase && window.SB_URL) ? window.supabase.createClient(window.SB_URL, window.SB_ANON) : null;

  var STYLES = {
    nuit: 'https://tiles.openfreemap.org/styles/dark',
    jour: 'https://tiles.openfreemap.org/styles/positron'
  };
  var theme = localStorage.getItem('tilexmap-theme') || 'nuit';

  // Couleurs par thème
  var C = {
    nuit: { principal:'#ff7a00', forestier:'#ff2d2d', glow:'#ff2d2d', texte:'#ffffff', halo:'#ff6a00',
            borne:'#ffffff', borneTxt:'#111', pont:'#ffd24a' },
    jour: { principal:'#2a7cff', forestier:'#1f7a3d', glow:'#1f7a3d', texte:'#0b0b0b', halo:'#ffffff',
            borne:'#1f7a3d', borneTxt:'#fff', pont:'#a05a00' }
  };

  var map = new maplibregl.Map({
    container:'map', style:STYLES[theme],
    center:[-71.5, 48.5], zoom:5.4,     // Québec
    maxZoom:18, attributionControl:{compact:true}, hash:true
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:true}), 'bottom-right');
  var geoloc = new maplibregl.GeolocateControl({
    positionOptions:{enableHighAccuracy:true}, trackUserLocation:true, showUserHeading:true, showAccuracyCircle:true
  });
  map.addControl(geoloc, 'bottom-right');

  // Données en mémoire (re-injectées à chaque changement de style)
  var cheminsFC = {type:'FeatureCollection', features:[]};
  var bornesFC  = {type:'FeatureCollection', features:[]};
  var pointsFC  = {type:'FeatureCollection', features:[]};
  var dashInterval = null;

  function col(){ return C[theme]; }

  /* ── Distance haversine (km) ── */
  function hav(a,b){
    var R=6371, dLat=(b[1]-a[1])*Math.PI/180, dLng=(b[0]-a[0])*Math.PI/180;
    var la1=a[1]*Math.PI/180, la2=b[1]*Math.PI/180;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2);
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }
  function longueurKm(coords){ var t=0; for(var i=1;i<coords.length;i++)t+=hav(coords[i-1],coords[i]); return t; }

  /* ── Bornes kilométriques : un point à chaque km le long du chemin ── */
  function genererBornes(coords, nom){
    var pts=[], cumul=0, prochain=1;
    for(var i=1;i<coords.length;i++){
      var seg=hav(coords[i-1],coords[i]);
      while(cumul+seg>=prochain){
        var r=(prochain-cumul)/seg;
        var lng=coords[i-1][0]+(coords[i][0]-coords[i-1][0])*r;
        var lat=coords[i-1][1]+(coords[i][1]-coords[i-1][1])*r;
        pts.push({type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{km:prochain,nom:nom}});
        prochain++;
      }
      cumul+=seg;
    }
    return pts;
  }

  /* ── Ajoute (ou ré-ajoute) nos couches par-dessus le style de base ── */
  function ajouterCouches(){
    var c=col();
    // Sources
    if(!map.getSource('chemins')) map.addSource('chemins',{type:'geojson',data:cheminsFC});
    else map.getSource('chemins').setData(cheminsFC);
    if(!map.getSource('bornes')) map.addSource('bornes',{type:'geojson',data:bornesFC});
    else map.getSource('bornes').setData(bornesFC);
    if(!map.getSource('points')) map.addSource('points',{type:'geojson',data:pointsFC});
    else map.getSource('points').setData(pointsFC);

    var forestFilter=['==',['get','type'],'forestier'];
    var autreFilter=['!=',['get','type'],'forestier'];

    // 1) Halo (large + flou) sous les chemins forestiers
    if(!map.getLayer('ch-glow')) map.addLayer({id:'ch-glow',type:'line',source:'chemins',filter:forestFilter,
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':c.glow,'line-width':11,'line-blur':9,'line-opacity':0.55}});
    // 2) Ligne de base des forestiers (couleur pleine)
    if(!map.getLayer('ch-base')) map.addLayer({id:'ch-base',type:'line',source:'chemins',filter:forestFilter,
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':c.forestier,'line-width':4}});
    // 3) Effet « courant » : trait pointillé animé qui coule (nuit surtout)
    if(!map.getLayer('ch-flow')) map.addLayer({id:'ch-flow',type:'line',source:'chemins',filter:forestFilter,
      layout:{'line-cap':'butt','line-join':'round'},
      paint:{'line-color':'#ffffff','line-width':2.2,'line-opacity':theme==='nuit'?0.9:0.35,'line-dasharray':[0,4,3]}});
    // 4) Chemins principaux/secondaires tracés (orange nuit / bleu jour)
    if(!map.getLayer('ch-autre')) map.addLayer({id:'ch-autre',type:'line',source:'chemins',filter:autreFilter,
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':c.principal,'line-width':4}});
    // 5) Nom des chemins le long de la ligne (texte blanc brillant la nuit)
    if(!map.getLayer('ch-nom')) map.addLayer({id:'ch-nom',type:'symbol',source:'chemins',
      layout:{'symbol-placement':'line','text-field':['get','nom'],'text-size':12.5,
        'text-font':['Noto Sans Bold'],'text-letter-spacing':0.02,'symbol-spacing':240},
      paint:{'text-color':c.texte,'text-halo-color':c.halo,'text-halo-width':2,'text-halo-blur':theme==='nuit'?2:0.3}});
    // 6) Bornes kilométriques
    if(!map.getLayer('bornes-pt')) map.addLayer({id:'bornes-pt',type:'circle',source:'bornes',minzoom:11,
      paint:{'circle-radius':8,'circle-color':c.borne,'circle-stroke-color':c.forestier,'circle-stroke-width':2}});
    if(!map.getLayer('bornes-txt')) map.addLayer({id:'bornes-txt',type:'symbol',source:'bornes',minzoom:11,
      layout:{'text-field':['to-string',['get','km']],'text-size':10,'text-font':['Noto Sans Bold'],'text-allow-overlap':true},
      paint:{'text-color':c.borneTxt}});
    // 7) Ponts / points
    if(!map.getLayer('pts-ic')) map.addLayer({id:'pts-ic',type:'symbol',source:'points',
      layout:{'text-field':['case',['==',['get','categorie'],'pont'],'🌉',['==',['get','categorie'],'barriere'],'🚧',['==',['get','categorie'],'camp'],'🏕️','📍'],
        'text-size':22,'text-allow-overlap':true,
        'text-offset':[0,-0.2]},
      paint:{}});
    if(!map.getLayer('pts-nom')) map.addLayer({id:'pts-nom',type:'symbol',source:'points',minzoom:10,
      layout:{'text-field':['get','nom'],'text-size':11,'text-font':['Noto Sans Bold'],'text-offset':[0,1.1],'text-anchor':'top'},
      paint:{'text-color':c.texte,'text-halo-color':c.halo,'text-halo-width':1.6}});
    // POIs (gaz/banque/…)
    if(!map.getSource('pois')) map.addSource('pois',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    if(!map.getLayer('pois-ic')) map.addLayer({id:'pois-ic',type:'symbol',source:'pois',
      layout:{'text-field':['get','emoji'],'text-size':20,'text-allow-overlap':true},paint:{}});

    demarrerAnimation();
    colorerRoutesBase();
  }

  /* ── Effet « courant qui coule » sur les chemins forestiers ── */
  var dashSeq=[[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],[0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]];
  var dashIx=0;
  function demarrerAnimation(){
    if(dashInterval)clearInterval(dashInterval);
    dashInterval=setInterval(function(){
      if(!map.getLayer('ch-flow'))return;
      dashIx=(dashIx+1)%dashSeq.length;
      try{map.setPaintProperty('ch-flow','line-dasharray',dashSeq[dashIx]);}catch(e){}
    },90);
  }

  /* ── Recolore les routes du fond de carte (principales orange/bleu) ── */
  function colorerRoutesBase(){
    var c=col();
    try{
      var layers=map.getStyle().layers||[];
      for(var i=0;i<layers.length;i++){
        var L=layers[i];
        if(L.type!=='line')continue;
        if((L['source-layer']||'')!=='transportation')continue;
        var id=L.id;
        // Grosses routes → couleur d'accent ; petites → on laisse le style.
        if(/motorway|trunk|primary/i.test(id)){
          map.setPaintProperty(id,'line-color',c.principal);
        }else if(/secondary|tertiary/i.test(id)){
          map.setPaintProperty(id,'line-color',theme==='nuit'?'#c85f10':'#5a92ff');
        }
      }
    }catch(e){}
  }

  /* ── Charge les chemins + points depuis Supabase ── */
  async function charger(){
    if(!SB)return;
    try{
      var r1=await SB.from('chemins_forestiers').select('id,nom,type,geojson,longueur_km,limite_vitesse,couleur').limit(2000);
      var chs=(r1.data||[]);
      cheminsFC.features=chs.map(function(ch){
        var g=ch.geojson; var coords=(g&&g.coordinates)?g.coordinates:[];
        var etiquette=ch.nom+(ch.longueur_km?(' · '+Number(ch.longueur_km).toFixed(1)+' km'):'')+(ch.limite_vitesse?(' · '+ch.limite_vitesse):'');
        return {type:'Feature',geometry:{type:'LineString',coordinates:coords},
          properties:{id:ch.id,nom:etiquette,brut:ch.nom,type:ch.type||'forestier'}};
      });
      // Bornes km pour les forestiers
      bornesFC.features=[];
      chs.forEach(function(ch){
        if((ch.type||'forestier')!=='forestier')return;
        var coords=(ch.geojson&&ch.geojson.coordinates)?ch.geojson.coordinates:[];
        if(coords.length>1)bornesFC.features=bornesFC.features.concat(genererBornes(coords,ch.nom));
      });
      var r2=await SB.from('carte_points').select('id,categorie,nom,lng,lat').limit(2000);
      pointsFC.features=(r2.data||[]).map(function(p){
        return {type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat]},properties:{id:p.id,categorie:p.categorie,nom:p.nom||''}};
      });
      if(map.getSource('chemins'))map.getSource('chemins').setData(cheminsFC);
      if(map.getSource('bornes'))map.getSource('bornes').setData(bornesFC);
      if(map.getSource('points'))map.getSource('points').setData(pointsFC);
    }catch(e){ console.warn('[tilexmap] chargement:',e&&e.message); }
  }

  /* ════ MA POSITION ════ */
  // Le contrôle MapLibre (joli point bleu + suivi + cap) échoue en SILENCE si :
  //  - on clique avant qu'il soit prêt (map pas encore chargée) → trigger()=false
  //  - la permission est refusée / pas de signal → aucun message à l'écran
  // On rajoute donc : (1) des messages clairs sur erreur, (2) un repli GPS direct
  // qui vole vers ta position pis pose un marqueur, même hors-ligne (GPS pur).
  var _monMarqueur=null;
  function majMarqueurMoi(c){
    if(_monMarqueur){ _monMarqueur.setLngLat(c); }
    else { _monMarqueur=new maplibregl.Marker({color:'#2b8cff'}).setLngLat(c).addTo(map); }
  }
  function msgErrGeo(code){
    if(code===1) return '📍 Permission refusée — autorise la localisation pour l\'app dans tes réglages';
    if(code===2) return '📍 Pas de signal GPS — réessaie dehors ou proche d\'une fenêtre';
    if(code===3) return '📍 Trop long à trouver ta position — réessaie';
    return '📍 Position indisponible';
  }
  geoloc.on('error', function(e){ toast(msgErrGeo(e&&e.code)); });

  function replisGPS(){
    if(!navigator.geolocation){ toast('📍 Géoloc pas supportée sur cet appareil'); return; }
    toast('📍 Recherche de ta position…');
    navigator.geolocation.getCurrentPosition(function(pos){
      var c=[pos.coords.longitude, pos.coords.latitude];
      map.flyTo({center:c, zoom:14});
      majMarqueurMoi(c);
      toast('📍 Te v\'là!');
    }, function(err){ toast(msgErrGeo(err&&err.code)); },
       {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  }

  document.getElementById('fab-loc').addEventListener('click', function(){
    var ok=false;
    try{ ok=geoloc.trigger(); }catch(e){ ok=false; }
    // Le contrôle pas prêt (a rien lancé) → on prend le repli GPS direct.
    if(ok===false) replisGPS();
  });
  document.getElementById('fab-nord').addEventListener('click', function(){ map.easeTo({bearing:0,pitch:0}); });

  /* ════ RECHERCHE DE LIEU (Nominatim, gratuit) ════ */
  document.getElementById('btn-recherche').addEventListener('click', async function(){
    var q=prompt('Chercher un lieu, une ville, une adresse :');

    try{

      var d=await r.json();
      if(d&&d[0]){ map.flyTo({center:[parseFloat(d[0].lon),parseFloat(d[0].lat)],zoom:12}); }
      else toast('Lieu pas trouvé');
    }catch(e){ toast('Recherche indisponible'); }
  });

  /* ════ MODE TRACER UN CHEMIN ════ */
  var enTrace=false, tracePts=[];
  function majTrace(){
    if(map.getSource('trace')){
      map.getSource('trace').setData({type:'Feature',geometry:{type:'LineString',coordinates:tracePts}});
    }
    document.getElementById('db-km').textContent=longueurKm(tracePts).toFixed(1)+' km';
  }
  function demarrerTrace(){
    enTrace=true; tracePts=[];
    document.getElementById('t-tracer').classList.add('on');
    document.getElementById('draw-bar').classList.add('on');
    map.getCanvas().style.cursor='crosshair';
    if(!map.getSource('trace')){
      map.addSource('trace',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
      map.addLayer({id:'trace-l',type:'line',source:'trace',paint:{'line-color':'#ffd24a','line-width':4,'line-dasharray':[2,2]}});
      map.addLayer({id:'trace-p',type:'circle',source:'trace',paint:{'circle-radius':5,'circle-color':'#ffd24a','circle-stroke-color':'#000','circle-stroke-width':1}});
    }
    toast('✏️ Touche la carte pour tracer');
  }
  function arreterTrace(){
    enTrace=false;
    document.getElementById('t-tracer').classList.remove('on');
    document.getElementById('draw-bar').classList.remove('on');
    map.getCanvas().style.cursor='';
    tracePts=[]; majTrace();
  }
  document.getElementById('t-tracer').addEventListener('click', function(){
    if(enTrace)arreterTrace(); else { annulerPont(); demarrerTrace(); }
  });
  document.getElementById('db-annuler').addEventListener('click', arreterTrace);

  document.getElementById('t-pont').addEventListener('click', function(){

  /* ════ FEUILLES MODALES ════ */
  function ouvrirFeuille(id){ document.getElementById('voile').classList.add('on'); document.getElementById(id).classList.add('on'); }
  function fermerFeuilles(){ document.getElementById('voile').classList.remove('on');

  async function session(){ try{ var s=await SB.auth.getSession(); return s.data.session; }catch(e){ return null; } }

  document.getElementById('ch-ok').addEventListener('click', async function(){
    var nom=(document.getElementById('ch-nom').value||'').trim();
    if(!nom){ toast('Donne un nom au chemin'); return; }
    var type=document.getElementById('ch-type').value;
    var vit=parseInt(document.getElementById('ch-vit').value)||null;
    var coords=tracePts.slice();
    var km=longueurKm(coords);
    var sess=await session();
    if(!sess){ toast('Connecte-toi pour sauvegarder'); return; }
    try{
      var ins=await SB.from('chemins_forestiers').insert({
        nom:nom, type:type, geojson:{type:'LineString',coordinates:coords},
        longueur_km:Number(km.toFixed(2)), limite_vitesse:vit, user_email:sess.user.email
      });
      if(ins.error)throw ins.error;
      fermerFeuilles(); arreterTrace(); await charger();
      toast('✅ '+nom+' sauvegardé ('+km.toFixed(1)+' km)');
    }catch(e){ toast('❌ '+(e.message||'Sauvegarde refusée')); }
  });

  document.getElementById('pt-ok').addEventListener('click', async function(){
    if(!pontLngLat){ fermerFeuilles(); return; }
    var nom=(document.getElementById('pt-nom').value||'').trim();

    if(!sess){ toast('Connecte-toi pour sauvegarder'); return; }
    try{

      pontLngLat=null; fermerFeuilles(); await charger();

  /* ════ POIs via Overpass (gaz, banque, dépanneur, resto) ════ */
  var poisActifs={};
  var POI_EMOJI={fuel:'⛽',bank:'🏦',convenience:'🏪',restaurant:'🍔'};
  document.querySelectorAll('.tool[data-poi]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key=btn.getAttribute('data-poi');
      poisActifs[key]=!poisActifs[key];
      btn.classList.toggle('on',poisActifs[key]);
      chargerPois();
    });
  });
  var poisTimer=null;
  map.on('moveend', function(){ if(Object.keys(poisActifs).some(function(k){return poisActifs[k];})) chargerPois(); });
  async function chargerPois(){
    var actifs=Object.keys(poisActifs).filter(function(k){return poisActifs[k];});
    if(!actifs.length){ if(map.getSource('pois'))map.getSource('pois').setData({type:'FeatureCollection',features:[]}); return; }
    if(map.getZoom()<10){ toast('Zoome un peu pour voir les commerces'); return; }
    var b=map.getBounds();
    var bbox=b.getSouth().toFixed(4)+','+b.getWest().toFixed(4)+','+b.getNorth().toFixed(4)+','+b.getEast().toFixed(4);
    var parts=actifs.map(function(k){
      return 'node["amenity"="'+k+'"]('+bbox+');node["shop"="'+k+'"]('+bbox+');';
    }).join('');
    var query='[out:json][timeout:20];('+parts+');out center 200;';
    clearTimeout(poisTimer);
    poisTimer=setTimeout(async function(){
      try{
        var r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
        var d=await r.json();
        var feats=(d.elements||[]).map(function(el){
          var lng=el.lon!=null?el.lon:(el.center&&el.center.lon), lat=el.lat!=null?el.lat:(el.center&&el.center.lat);
          if(lng==null)return null;
          var a=el.tags||{};
          var key=a.amenity||a.shop||'';
          return {type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},
            properties:{emoji:POI_EMOJI[key]||'📍',nom:a.name||''}};
        }).filter(Boolean);
        if(map.getSource('pois'))map.getSource('pois').setData({type:'FeatureCollection',features:feats});
      }catch(e){ /* Overpass parfois occupé → silencieux */ }
    },400);
  }
  map.on('click','pois-ic', function(e){
    var f=e.features&&e.features[0]; if(!f||!f.properties.nom)return;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<div class="popup"><b>'+f.properties.nom+'</b></div>').addTo(map);
  });

  /* ════ FEUILLE INFO (bottom sheet) ════ */

  function esc(s){ return String(s||'').replace(/[<>&"]/g,function(m){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m];}); }

  /* ════ POURVOIRIES / ZEC (Overpass + exemples hors-ligne) ════ */
  var pourvOn=false, pourvMarkers=[], seedMarkers=[];
  var SEED_POURV=[
    {n:'Pourvoirie du Lac Blanc (ex.)',lat:46.68,lon:-73.18,r:'Mauricie'},
    {n:'Pourvoirie Mekoos (ex.)',lat:46.93,lon:-75.28,r:'Hautes-Laurentides'},
    {n:'Pourvoirie Kanawata (ex.)',lat:47.71,lon:-73.62,r:'Haute-Mauricie'},
    {n:'Pourvoirie Fer à Cheval (ex.)',lat:48.10,lon:-74.20,r:'Lac-Saint-Jean'}
  ];
  function marqueurPourv(lat,lon,tags,exemple){
    var el=document.createElement('div');
    el.style.cssText='width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);background:#1f7a3d;'+
      'border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;'+(exemple?'opacity:.9;':'');
    el.innerHTML='<span style="transform:rotate(-45deg);font-size:13px;">🎣</span>';
    var m=new maplibregl.Marker({element:el}).setLngLat([lon,lat]).addTo(map);
    el.addEventListener('click',function(ev){ ev.stopPropagation(); ficheePourvoirie(tags,lat,lon,exemple); });
    return m;
  }
  function ficheePourvoirie(tags,lat,lon,exemple){
    tags=tags||{};
    var nom=tags.name||'Pourvoirie';
    var site=tags.website||tags['contact:website'];
    var tel=tags.phone||tags['contact:phone'];
    var h='<div class="s-type">Pourvoirie / ZEC</div><h2>'+esc(nom)+'</h2>';
    h+=sRow('🕑', tags.opening_hours?esc(tags.opening_hours.replace(/;/g,' · ')):'');
    h+=sRow('📞', tel?'<a href="tel:'+esc(tel)+'">'+esc(tel)+'</a>':'');
    h+=sRow('🌐', site?'<a href="'+esc(site)+'" target="_blank" rel="noopener">'+esc(site.replace(/^https?:\/\//,''))+'</a>':'');
    h+='<div class="s-sect"><h3>Pêche &amp; lacs</h3><div class="s-chips">'+
       '<span class="s-chip">Doré</span><span class="s-chip">Brochet</span><span class="s-chip">Touladi</span><span class="s-chip">Truite mouchetée</span></div>';
    h+='<div class="s-note">ℹ️ Espèces par lac, quotas, hébergement pis heures : gabarit à compléter — chaque pourvoirie aura sa fiche remplie.'+(exemple?' <b>Emplacement d\'exemple (approx.)</b> — utilise 🎣 Pourvoiries pour les vraies données en ligne.':'')+'</div></div>';
    var geo='geo:'+lat+','+lon+'?q='+lat+','+lon+'('+encodeURIComponent(nom)+')';
    var osm='https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=15/'+lat+'/'+lon;
    h+='<div class="s-actions"><a class="go" href="'+geo+'">🧭 M\'y rendre</a><a href="'+osm+'" target="_blank" rel="noopener">Voir sur OSM</a></div>';
    ouvrirSheet(h);
  }
  function afficherSeedPourv(){
    seedMarkers.forEach(function(m){m.remove();}); seedMarkers=[];
    SEED_POURV.forEach(function(s){ seedMarkers.push(marqueurPourv(s.lat,s.lon,{name:s.n},true)); });
  }
  async function chargerPourvoiries(){
    if(map.getZoom()<9){ toast('Zoome un peu pour chercher les pourvoiries du secteur'); return; }
    var b=map.getBounds();
    var bbox=b.getSouth().toFixed(4)+','+b.getWest().toFixed(4)+','+b.getNorth().toFixed(4)+','+b.getEast().toFixed(4);
    var query='[out:json][timeout:25];(nwr["name"~"[Pp]ourvoirie|[Zz]ec|[Oo]utfitter"]('+bbox+'););out center 150;';
    busy(true,'Recherche des pourvoiries…');
    try{
      var r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(query)});
      var d=await r.json();
      pourvMarkers.forEach(function(m){m.remove();}); pourvMarkers=[];
      var n=0;
      (d.elements||[]).forEach(function(el){
        var lat=el.lat!=null?el.lat:(el.center&&el.center.lat), lon=el.lon!=null?el.lon:(el.center&&el.center.lon);
        if(lat==null||lon==null)return;
        pourvMarkers.push(marqueurPourv(lat,lon,el.tags||{},false)); n++;
      });
      toast(n?(n+' pourvoirie'+(n>1?'s':'')+' trouvée'+(n>1?'s':'')+' dans le secteur'):'Aucune pourvoirie trouvée ici (essaie un autre secteur)');
    }catch(e){ toast('Recherche en ligne impossible — voici des exemples hors-ligne'); afficherSeedPourv(); }
    finally{ busy(false); }
  }
  document.getElementById('t-pourvoirie').addEventListener('click', function(){

    this.classList.toggle('on',pourvOn);

    else{ pourvMarkers.forEach(function(m){m.remove();}); pourvMarkers=[];
          seedMarkers.forEach(function(m){m.remove();}); seedMarkers=[]; }

  /* ════ TRACÉ LIVE (GPS, s'enregistre en roulant) ════ */
  var liveOn=false, liveWatch=null, liveCoords=[];
  function majLive(){ if(map.getSource('live'))map.getSource('live').setData({type:'Feature',geometry:{type:'LineString',coordinates:liveCoords}}); }
  function demarrerLive(){
    if(!navigator.geolocation){ toast('📍 GPS pas disponible sur cet appareil'); return; }
    liveOn=true; liveCoords=[];
    document.getElementById('t-live').classList.add('on');
    if(!map.getSource('live')){
      map.addSource('live',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
      map.addLayer({id:'live-l',type:'line',source:'live',layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#ff2d55','line-width':5,'line-opacity':.95}});
    }
    liveWatch=navigator.geolocation.watchPosition(function(p){
      var ll=[p.coords.longitude,p.coords.latitude];
      liveCoords.push(ll); majLive(); majMarqueurMoi(ll); map.easeTo({center:ll,duration:600});
    }, function(e){ toast(msgErrGeo(e&&e.code)); }, {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
    toast('🔴 Enregistrement du tracé… roule, je te suis 🛰️');
  }
  function arreterLive(){
    liveOn=false; document.getElementById('t-live').classList.remove('on');
    if(liveWatch!=null){ navigator.geolocation.clearWatch(liveWatch); liveWatch=null; }
    toast(liveCoords.length>1?('Tracé enregistré ('+liveCoords.length+' points). « Partager » pour l\'envoyer.'):'Aucun point capté.');
  }
  document.getElementById('t-live').addEventListener('click', function(){ if(liveOn)arreterLive(); else demarrerLive(); });

  /* ════ PARTAGER LE TRACÉ (GPX) ════ */
  function toGPX(coords){
    var now=new Date().toISOString();
    var pts=coords.map(function(c){ return '   <trkpt lat="'+c[1].toFixed(6)+'" lon="'+c[0].toFixed(6)+'"></trkpt>'; }).join('\n');
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+
      '<gpx version="1.1" creator="TILEXMAP" xmlns="http://www.topografix.com/GPX/1/1">\n'+
      ' <metadata><name>Tracé TILEXMAP</name><time>'+now+'</time></metadata>\n'+
      ' <trk><name>Tracé TILEXMAP</name><trkseg>\n'+pts+'\n </trkseg></trk>\n</gpx>';
  }
  document.getElementById('t-partage').addEventListener('click', async function(){
    var coords = liveCoords.length>1?liveCoords:(tracePts.length>1?tracePts:null);
    if(!coords){ toast('Pas de tracé à partager. Fais « Tracé live » ou « Tracer un chemin » d\'abord.'); return; }
    var gpx=toGPX(coords);
    try{
      var file=new File([gpx],'trace-tilexmap.gpx',{type:'application/gpx+xml'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Mon tracé TILEXMAP',text:'Voici mon tracé forestier 🌲'});
        return;
      }
    }catch(e){}
    var url=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
    var a=document.createElement('a'); a.href=url; a.download='trace-tilexmap.gpx'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    toast('Tracé exporté en GPX 📤');
  });

  /* ════ TÉLÉCHARGER LE SECTEUR (hors-ligne) ════ */
  function lonlat2tile(lon,lat,z){
    var n=Math.pow(2,z), x=Math.floor((lon+180)/360*n);
    var y=Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n);
    return [x,y];
  }
  document.getElementById('t-offline').addEventListener('click', async function(){
    var src=map.getStyle().sources, tmpl=null;
    for(var k in src){ if(src[k].tiles && src[k].tiles[0]){ tmpl=src[k].tiles[0]; break; } }
    if(!tmpl){ toast('Impossible de trouver la source de tuiles'); return; }
    var b=map.getBounds(), z0=Math.max(6,Math.floor(map.getZoom())), urls={};
    for(var z=z0; z<=Math.min(z0+3,15); z++){
      var t0=lonlat2tile(b.getWest(),b.getNorth(),z), t1=lonlat2tile(b.getEast(),b.getSouth(),z);
      for(var x=t0[0];x<=t1[0];x++) for(var y=t0[1];y<=t1[1];y++){
        urls[tmpl.replace('{z}',z).replace('{x}',x).replace('{y}',y)]=1;
        if(Object.keys(urls).length>500)break;
      }
    }
    var list=Object.keys(urls).slice(0,500), ok=0;
    busy(true,'Téléchargement hors-ligne ('+list.length+' tuiles)…');
    await Promise.all(list.map(function(u){ return fetch(u,{mode:'cors'}).then(function(){ok++;}).catch(function(){}); }));
    busy(false);
    toast('Secteur en cache ('+ok+'/'+list.length+' tuiles) — visible hors réseau 🌲');
  });

  /* ════ TOAST ════ */
  var toastEl=null;
  function toast(t){
    if(toastEl)toastEl.remove();
    toastEl=document.createElement('div');toastEl.className='toast';toastEl.textContent=t;
    document.body.appendChild(toastEl);
    setTimeout(function(){ if(toastEl){toastEl.remove();toastEl=null;} },2600);
  }

  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
  })();
  </script>
</body>
</html>
