<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚛 ti-lex Truck - Émetteur GPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a0f; color:#e8e8e8; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  h1 { font-size:1.4rem; color:#ff3b3b; margin:14px 0 4px; text-align:center; }
  .sub { color:#888; font-size:0.85rem; margin-bottom:20px; text-align:center; }
  .card {
    background:#14141c; border:1px solid #26263a; border-radius:16px;
    padding:22px; width:100%; max-width:480px; margin-bottom:16px;
  }
  .status {
    display:flex; align-items:center; gap:10px; font-size:1.1rem;
    font-weight:600; margin-bottom:18px;
  }
  .dot { width:14px; height:14px; border-radius:50%; background:#555; }
  .dot.on { background:#2ecc71; box-shadow:0 0 12px #2ecc71; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #1e1e2a; }
  .row:last-child { border-bottom:none; }
  .label { color:#999; font-size:0.9rem; }
  .val { color:#fff; font-weight:600; font-size:0.95rem; }
  .acct { font-size:0.82rem; padding:8px 12px; border-radius:10px; margin-bottom:14px; }
  .acct.ok { background:rgba(46,204,113,.12); border:1px solid #2ecc7155; color:#9affc0; }
  .acct.no { background:rgba(255,59,59,.12); border:1px solid #ff3b3b55; color:#ffb3b3; }
  .acct a { color:#ff7a00; }
  button {
    width:100%; padding:18px; border:none; border-radius:14px;
    font-size:1.2rem; font-weight:700; cursor:pointer; margin-top:8px;
    transition:transform .1s, background .2s;
  }
  button:active { transform:scale(0.97); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .start { background:#2ecc71; color:#062b14; }
  .stop { background:#ff3b3b; color:#fff; }
  .log {
    background:#0d0d14; border:1px solid #1e1e2a; border-radius:10px;
    padding:12px; font-size:0.78rem; color:#7a7a8a; max-height:160px;
    overflow-y:auto; font-family:monospace; margin-top:8px;
  }
  .log div { padding:2px 0; }
</style>
</head>
<body>

  <h1>🚛 ti-lex TRUCK</h1>
  <div class="sub">Émetteur GPS — Camion d'Alex 🛰️</div>

  <div class="card">
    <div class="acct no" id="acct">🔒 Vérification du compte…</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">Arrêté</span>
    </div>
    <div class="row"><span class="label">📍 Latitude</span><span class="val" id="lat">--</span></div>
    <div class="row"><span class="label">📍 Longitude</span><span class="val" id="lon">--</span></div>
    <div class="row"><span class="label">🚀 Vitesse</span><span class="val" id="spd">-- km/h</span></div>
    <div class="row"><span class="label">📡 Dernier envoi</span><span class="val" id="last">--</span></div>
    <div class="row"><span class="label">✅ Envois réussis</span><span class="val" id="count">0</span></div>
  </div>

  <div class="card">
    <button class="start" id="btn" onclick="toggle()">▶️ DÉMARRER LE TRACKING</button>
    <div class="log" id="log"></div>
  </div>

<script src="js/tilex-config.js"></script>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Même config que pro.html/web.html (clé anon JWT) → session partagée + RLS.
  const SUPABASE_URL = window.SB_URL || 'https://rnuripmfozlxenryxhdc.supabase.co';
  const SUPABASE_KEY = window.SB_ANON || '';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const TRUCK_ID = 'camion-alex'; // identifiant du camion

  let watchId = null;
  let count = 0;
  let session = null;

  // ── Compte : l'insert exige auth.uid() (RLS). On reflète l'état de session. ──
  async function refreshAccount() {
    try {
      const { data } = await supabase.auth.getSession();
      session = data && data.session ? data.session : null;
    } catch (e) { session = null; }
    const a = document.getElementById('acct');
    const btn = document.getElementById('btn');
    if (session && session.user) {
      a.className = 'acct ok';
      a.textContent = '✅ Connecté : ' + (session.user.email || session.user.id);
      btn.disabled = false;
    } else {
      a.className = 'acct no';
      a.innerHTML = '🔒 Connecte-toi d’abord sur la plateforme (même appareil) — ouvre <a href="/pro">/pro</a>, connecte-toi, puis reviens ici.';
      btn.disabled = true;
      if (watchId !== null) stop();
    }
  }
  supabase.auth.onAuthStateChange(() => { refreshAccount(); });

  window.toggle = function() {
    if (watchId === null) start();
    else stop();
  };

  function start() {
    if (!session || !session.user) { log('🔒 Connecte-toi d’abord (compte ti-lex)'); refreshAccount(); return; }
    if (!navigator.geolocation) { log('❌ GPS non supporté'); return; }
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy:true, maximumAge:0, timeout:20000
    });
    document.getElementById('dot').classList.add('on');
    document.getElementById('statusTxt').textContent = 'EN ROUTE 🛰️';
    const b = document.getElementById('btn');
    b.textContent = '⏹️ ARRÊTER LE TRACKING';
    b.className = 'stop';
    log('▶️ Tracking démarré');
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    document.getElementById('dot').classList.remove('on');
    document.getElementById('statusTxt').textContent = 'Arrêté';
    const b = document.getElementById('btn');
    b.textContent = '▶️ DÉMARRER LE TRACKING';
    b.className = 'start';
    log('⏹️ Tracking arrêté');
  }

  async function onPos(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const spd = pos.coords.speed ? (pos.coords.speed * 3.6) : 0; // m/s → km/h

    document.getElementById('lat').textContent = lat.toFixed(5);
    document.getElementById('lon').textContent = lon.toFixed(5);
    document.getElementById('spd').textContent = spd.toFixed(0) + ' km/h';

    // user_id est rempli automatiquement par le défaut auth.uid() (RLS).
    const { error } = await supabase.from('truck_position').insert({
      truck_id: TRUCK_ID,
      lat: lat,
      lon: lon,
      vitesse: spd
    });

    if (error) {
      log('❌ Erreur envoi: ' + error.message);
    } else {
      count++;
      const t = new Date().toLocaleTimeString('fr-CA');
      document.getElementById('last').textContent = t;
      document.getElementById('count').textContent = count;
      log('✅ Position envoyée — ' + t);
    }
  }

  function onErr(err) {
    log('⚠️ GPS: ' + err.message);
  }

  function log(msg) {
    const l = document.getElementById('log');
    const d = document.createElement('div');
    d.textContent = '› ' + msg;
    l.prepend(d);
    while (l.children.length > 30) l.removeChild(l.lastChild);
  }

  refreshAccount();
</script>
</body>
</html>
