<!DOCTYPE html>
<!-- ============================================
     📁 midas-finance.html
     MIDAS FINANCE 🇨🇦 — ti-lex-AL v10
     Prix live CoinGecko → dollars canadiens
     Auteur: Alex Marceau-Prévost
     🔒 Données API échappées avant insertion (anti-XSS).
     ============================================ -->
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDAS Finance 🇨🇦</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a0f;
      color:#e8e8e8;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      min-height:100vh;
    }

    /* ===== HEADER ===== */
    .midas-header {
      background:linear-gradient(135deg,#1a1400 0%,#0a0a0f 60%);
      border-bottom:1px solid #c9a400;
      padding:20px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:100;
    }
    .midas-logo { display:flex; align-items:center; gap:12px; }
    .midas-logo-icon {
      width:46px; height:46px;
      background:linear-gradient(135deg,#FFD700,#c9a400);
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px;
      box-shadow:0 0 20px rgba(201,164,0,0.4);
    }
    .midas-titre {
      font-size:1.7em; font-weight:800; letter-spacing:2px;
      background:linear-gradient(135deg,#FFD700,#c9a400);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .midas-sous { font-size:0.72em; color:#888; letter-spacing:1px; }
    .midas-maj { text-align:right; font-size:0.75em; color:#666; }
    .midas-maj b { color:#c9a400; }

    /* ===== SEARCH ===== */
    .midas-top {
      max-width:1400px; margin:0 auto;
      padding:18px 28px 0;
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    }
    .midas-search {
      flex:1; min-width:200px;
      background:#13131a; border:1px solid #333; border-radius:10px;
      padding:11px 18px; color:#e8e8e8; font-size:0.92em; outline:none;
      transition:border-color 0.2s;
    }
    .midas-search:focus { border-color:#c9a400; }
    .midas-search::placeholder { color:#555; }
    .midas-refresh {
      background:linear-gradient(135deg,#FFD700,#c9a400);
      color:#000; font-weight:700; border:none; border-radius:10px;
      padding:11px 20px; cursor:pointer; font-size:0.88em;
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .midas-refresh:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(201,164,0,0.3); }
    .midas-refresh:disabled { opacity:0.5; cursor:not-allowed; }

    /* ── Sélecteur de vue : top 50 par défaut, puis 250 et tout ── */
    .midas-vues {
      max-width:1400px; margin:0 auto;
      padding:14px 28px 0;
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    }
    .midas-vue {
      background:#141420; border:1px solid #2a2a3a; color:#8a8a9a;
      border-radius:9px; padding:7px 15px; font-size:13px; font-weight:600;
      cursor:pointer; transition:border-color .18s, color .18s, background .18s;
    }
    .midas-vue:hover { border-color:#c9a400; color:#c9a400; }
    .midas-vue.actif {
      background:rgba(201,164,0,.12); border-color:#c9a400; color:#FFD700;
    }
    .midas-vues-note { color:#555; font-size:11px; margin-left:4px; }

    /* ===== STATS ===== */
    .midas-stats {
      display:flex; gap:12px; flex-wrap:wrap;
      max-width:1400px; margin:0 auto;
      padding:14px 28px;
    }
    .midas-stat {
      background:#13131a; border:1px solid #1e1e2e;
      border-radius:10px; padding:12px 18px; flex:1; min-width:130px;
    }
    .midas-stat-label { font-size:0.7em; color:#666; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
    .midas-stat-val { font-size:1.05em; font-weight:700; color:#FFD700; }

    /* ===== GRID ===== */
    .midas-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
      gap:12px;
      max-width:1400px; margin:0 auto;
      padding:14px 28px 50px;
    }

    /* ===== CARTE ===== */
    .midas-card {
      background:#13131a; border:1px solid #1e1e2e;
      border-radius:14px; padding:16px;
      cursor:pointer; position:relative; overflow:hidden;
      transition:transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .midas-card::before {
      content:''; position:absolute;
      top:0; left:0; width:3px; height:100%;
      background:var(--c,#FFD700); opacity:0.8;
    }
    .midas-card:hover {
      transform:translateY(-3px);
      border-color:var(--c,#FFD700);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
    }
    .midas-card-top {
      display:flex; align-items:center; gap:10px; margin-bottom:12px;
    }
    .midas-card-logo {
      width:38px; height:38px; border-radius:50%;
      background:#1e1e2e; flex-shrink:0;
    }
    .midas-card-info { flex:1; min-width:0; }
    .midas-card-nom { font-weight:700; font-size:0.9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .midas-card-sym { font-size:0.75em; color:#888; letter-spacing:1px; }
    .midas-card-rang {
      font-size:0.68em; color:#555; background:#1e1e2e;
      padding:2px 7px; border-radius:20px; flex-shrink:0;
    }
    .midas-card-prix {
      font-size:1.2em; font-weight:800; color:#FFD700; margin-bottom:7px;
    }
    .midas-card-bottom { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .midas-badge {
      display:inline-flex; align-items:center; gap:3px;
      font-size:0.8em; font-weight:700;
      padding:3px 9px; border-radius:20px;
    }
    .midas-up   { background:rgba(22,199,132,0.12); color:#16c784; }
    .midas-down { background:rgba(234,57,67,0.12);  color:#ea3943; }
    .midas-stake {
      font-size:0.68em; color:#16c784;
      background:rgba(22,199,132,0.1);
      border:1px solid rgba(22,199,132,0.25);
      padding:2px 7px; border-radius:20px;
    }
    .midas-vol { font-size:0.72em; color:#555; margin-top:6px; }

    /* ===== LOADING / ERREUR ===== */
    .midas-loading {
      grid-column:1/-1; text-align:center;
      padding:60px; color:#555;
    }
    .midas-spinner {
      width:38px; height:38px;
      border:3px solid #1e1e2e; border-top-color:#FFD700;
      border-radius:50%; animation:spin 0.8s linear infinite;
      margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .midas-err {
      grid-column:1/-1; text-align:center;
      padding:40px; color:#ea3943;
      background:rgba(234,57,67,0.06); border-radius:12px;
    }
    .midas-err button {
      margin-top:14px; background:#ea3943; color:#fff;
      border:none; border-radius:8px; padding:10px 20px;
      cursor:pointer; font-weight:700;
    }

    /* ===== MOBILE ===== */
    @media(max-width:600px){
      .midas-header { padding:14px 16px; }
      .midas-top, .midas-stats, .midas-grid { padding-left:16px; padding-right:16px; }
      .midas-titre { font-size:1.3em; }
      .midas-grid { grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:10px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="midas-header">
  <div class="midas-logo">
    <div class="midas-logo-icon">🪙</div>
    <div>
      <div class="midas-titre">MIDAS</div>
      <div class="midas-sous">FINANCE • DOLLAR CANADIEN 🇨🇦</div>
    </div>
  </div>
  <div class="midas-maj">Mise à jour<br><b id="midas-heure">—</b></div>
</header>

<!-- ===== SEARCH + REFRESH ===== -->
<div class="midas-top">
  <input class="midas-search" id="midas-search" type="text"
         placeholder="🔍 Chercher... BTC, ETH, SOL, DOGE..."
         oninput="Midas.filtrer(this.value)">
  <button class="midas-refresh" id="midas-btn" onclick="Midas.charger()">🔄 Actualiser</button>
</div>

<!-- ===== VUES : TOP 50 / 250 / TOUT ===== -->
<div class="midas-vues">
  <button class="midas-vue actif" id="vue-50"   onclick="Midas.changerVue(50)">🏆 Top 50</button>
  <button class="midas-vue"       id="vue-250"  onclick="Midas.changerVue(250)">Top 250</button>
  <button class="midas-vue"       id="vue-tout" onclick="Midas.changerVue('tout')">Toutes (500)</button>
  <span class="midas-vues-note">classement par capitalisation · logos officiels CoinGecko</span>
</div>

<!-- ===== STATS RAPIDES ===== -->
<div class="midas-stats">
  <div class="midas-stat">
    <div class="midas-stat-label">₿ BTC</div>
    <div class="midas-stat-val" id="stat-btc">—</div>
  </div>
  <div class="midas-stat">
    <div class="midas-stat-label">⟠ ETH</div>
    <div class="midas-stat-val" id="stat-eth">—</div>
  </div>
  <div class="midas-stat">
    <div class="midas-stat-label">◎ SOL</div>
    <div class="midas-stat-val" id="stat-sol">—</div>
  </div>
  <div class="midas-stat">
    <div class="midas-stat-label">📊 Cryptos live</div>
    <div class="midas-stat-val" id="stat-total">—</div>
  </div>
</div>

<!-- ===== GRILLE CRYPTOS ===== -->
<div class="midas-grid" id="midas-grid">
  <div class="midas-loading">
    <div class="midas-spinner"></div>
    Chargement des prix live en CAD 🇨🇦...
  </div>
</div>

<script>
// ============================================
// 🪙 MIDAS FINANCE ENGINE — ti-lex-AL v10
// CoinGecko API live → prix en dollars canadiens
// Auteur: Alex Marceau-Prévost
// 🔒 Données API échappées avant insertion (anti-XSS).
// ============================================

const Midas = {

  // 💾 Données en mémoire
  data: [],

  // 👁️ Vue courante : 50 (les plus populaires), 250, ou 'tout' (500).
  // Le top 50 par capitalisation, c'est ce qu'on veut voir en arrivant —
  // et ça évite de tirer 500 cartes à chaque rafraîchissement.
  vue: 50,

  // Page 2 (rangs 251-500) : chargée seulement si on demande « Toutes ».
  // CoinGecko limite le débit sur le forfait gratuit, chaque appel compte.
  page2Chargee: false,

  // 🥩 Cryptos stakables sur Wealthsimple Canada (ids CoinGecko)
  stakables: ['ethereum','solana','cardano','polkadot'],

  // 🎨 Couleurs de marque (clés = ids CoinGecko)
  couleurs: {
    bitcoin:'#F7931A', ethereum:'#627EEA', tether:'#26A17B',
    binancecoin:'#F3BA2F', solana:'#14F195', ripple:'#346AA9',
    dogecoin:'#C2A633', cardano:'#0033AD', 'avalanche-2':'#E84142',
    polkadot:'#E6007A', chainlink:'#2A5ADA', 'shiba-inu':'#FFA409',
    litecoin:'#345D9D', 'bitcoin-cash':'#0AC18E', stellar:'#7D00FF',
    monero:'#FF6600', algorand:'#000000', arbitrum:'#28A0F0',
    near:'#00C08B', aave:'#B6509E', bonk:'#FF7A00', sui:'#6FBCF0',
    pepe:'#479F53', 'the-open-network':'#0088CC'
  },

  /**
   * 🔒 Échappe les caractères HTML (anti-XSS) avant insertion.
   */
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  },

  /**
   * 💵 Format prix en dollars canadiens (style québécois)
   */
  cad(n) {
    if (n == null) return '—';
    return new Intl.NumberFormat('fr-CA', {
      style:'currency', currency:'CAD',
      maximumFractionDigits: n < 0.001 ? 8 : n < 1 ? 4 : 2
    }).format(n);
  },

  /**
   * 🌐 Appel API CoinGecko LIVE → /coins/markets en CAD
   * Fetche 250 cryptos par page, 2 pages = 500 cryptos!
   */
  async fetchCoinGecko(page = 1) {
    // ⚠️ Optionnel : clé Demo gratuite sur coingecko.com/api
    // Sans clé, ça marche quand même (limite plus basse).
    const CLE = ''; // <- colle ta clé Demo ici (gratuite sur coingecko.com)
    const base = 'https://api.coingecko.com/api/v3/coins/markets';
    const params = new URLSearchParams({
      vs_currency: 'cad',          // 🇨🇦 DOLLARS CANADIENS
      order: 'market_cap_desc',
      per_page: 250,
      page: page,
      sparkline: false,
      price_change_percentage: '24h'
    });
    const headers = CLE ? { 'x-cg-demo-api-key': CLE } : {};
    const res = await fetch(`${base}?${params}`, { headers });
    if (!res.ok) throw new Error(`CoinGecko erreur ${res.status}`);
    return await res.json();
  },

  /**
   * 🚀 Charge TOUTES les cryptos (2 pages = 500 coins live en CAD)
   */
  async charger() {
    const btn  = document.getElementById('midas-btn');
    const grid = document.getElementById('midas-grid');

    btn.disabled = true;
    btn.textContent = '⏳ Chargement...';
    grid.innerHTML = `<div class="midas-loading">
      <div class="midas-spinner"></div>
      Appel CoinGecko live en CAD 🇨🇦...
    </div>`;

    try {
      // La page 1 couvre les rangs 1 à 250 : elle suffit pour le top 50 et le
      // top 250. La page 2 n'est demandée que si la vue « Toutes » est active.
      const besoinPage2 = this.vue === 'tout';
      const [page1, page2] = await Promise.all([
        this.fetchCoinGecko(1),
        besoinPage2 ? this.fetchCoinGecko(2) : Promise.resolve([])
      ]);

      this.data = [...page1, ...page2];
      this.page2Chargee = besoinPage2;
      this.afficher(this.data);
      this.mettreAJourStats();

      // Heure de mise à jour
      document.getElementById('midas-heure').textContent =
        new Date().toLocaleTimeString('fr-CA');

    } catch (e) {
      console.error('MIDAS erreur:', e);
      grid.innerHTML = `<div class="midas-err">
        ⚠️ Impossible de charger les prix live.<br>
        <small>${this.esc(e.message)}</small><br>
        <button onclick="Midas.charger()">🔄 Réessayer</button>
      </div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '🔄 Actualiser';
    }
  },

  /**
   * 🃏 Génère une carte crypto (données API échappées → anti-XSS)
   */
  carte(c) {
    const couleur   = this.couleurs[c.id] || '#FFD700';
    const change    = c.price_change_percentage_24h;
    const estUp     = change >= 0;
    const classeVar = estUp ? 'midas-up' : 'midas-down';
    const fleche    = estUp ? '▲' : '▼';
    const stake     = this.stakables.includes(c.id)
      ? `<span class="midas-stake">🥩 Stakable WS</span>` : '';
    const vol       = c.total_volume
      ? `<div class="midas-vol">Vol 24h : ${this.cad(c.total_volume)}</div>` : '';

    // 🔒 Tout ce qui vient de l'API est échappé.
    const nom = this.esc(c.name);
    const sym = this.esc(String(c.symbol || '').toUpperCase());
    const img = this.esc(c.image);
    const rang = this.esc(c.market_cap_rank || '?');

    return `
      <div class="midas-card" style="--c:${couleur}">
        <div class="midas-card-top">
          <img class="midas-card-logo"
               src="${img}"
               alt="Logo ${nom}"
               loading="lazy"
               onerror="Midas.logoSecours(this,'${sym}')">
          <div class="midas-card-info">
            <div class="midas-card-nom">${nom}</div>
            <div class="midas-card-sym">${sym}</div>
          </div>
          <div class="midas-card-rang">#${rang}</div>
        </div>

        <div class="midas-card-prix">${this.cad(c.current_price)}</div>

        <div class="midas-card-bottom">
          <span class="midas-badge ${classeVar}">
            ${fleche} ${change != null ? Math.abs(change).toFixed(2) + '%' : '—'}
          </span>
          ${stake}
        </div>
        ${vol}
      </div>`;
  },

  /**
   * 🖥️ Affiche toutes les cartes dans la grille
   */
  afficher(liste, ignorerVue) {
    const grid = document.getElementById('midas-grid');
    // Les cryptos arrivent déjà triées par capitalisation : couper la liste
    // suffit à obtenir « les N plus populaires ».
    const vues = (ignorerVue || this.vue === 'tout') ? liste : liste.slice(0, this.vue);

    if (!vues.length) {
      grid.innerHTML = `<div class="midas-loading">Aucun résultat 🤷</div>`;
      document.getElementById('stat-total').textContent = '0 crypto';
      return;
    }
    grid.innerHTML = vues.map(c => this.carte(c)).join('');
    document.getElementById('stat-total').textContent =
      `${vues.length} crypto${vues.length > 1 ? 's' : ''}`;
  },

  /**
   * 👁️ Change la vue. Passer à « Toutes » déclenche le chargement de la
   * page 2 si elle n'est pas encore en mémoire.
   */
  async changerVue(v) {
    this.vue = v;
    ['50', '250', 'tout'].forEach(id => {
      const el = document.getElementById('vue-' + id);
      if (el) el.classList.toggle('actif', String(v) === id);
    });

    if (v === 'tout' && !this.page2Chargee) {
      await this.charger();
      return;
    }
    // Une recherche en cours reste prioritaire sur la vue.
    const terme = (document.getElementById('midas-search') || {}).value || '';
    if (terme.trim()) this.filtrer(terme);
    else this.afficher(this.data);
  },

  /**
   * 🖼️ Logo de secours quand l'image officielle ne charge pas : pastille SVG
   * générée sur place, avec le sigle. Aucun service tiers appelé.
   */
  logoSecours(img, sym) {
    img.onerror = null;
    const sigle = String(sym || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 5) || '?';
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38">' +
      '<rect width="38" height="38" rx="9" fill="#1e1e2e"/>' +
      '<text x="19" y="24" font-family="Arial,Helvetica,sans-serif" font-size="' +
      (sigle.length > 3 ? 9 : 12) +
      '" font-weight="700" fill="#c9a400" text-anchor="middle">' + sigle + '</text></svg>';
    img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  },

  /**
   * 📊 Met à jour les stats en haut (BTC, ETH, SOL en CAD)
   */
  mettreAJourStats() {
    const find = id => this.data.find(c => c.id === id);
    const btc = find('bitcoin');
    const eth = find('ethereum');
    const sol = find('solana');

    if (btc) document.getElementById('stat-btc').textContent = this.cad(btc.current_price);
    if (eth) document.getElementById('stat-eth').textContent = this.cad(eth.current_price);
    if (sol) document.getElementById('stat-sol').textContent = this.cad(sol.current_price);
  },

  /**
   * 🔍 Filtre les cryptos en temps réel selon la recherche
   */
  filtrer(terme) {
    if (!terme.trim()) {
      this.afficher(this.data);
      return;
    }
    const t = terme.toLowerCase();
    const res = this.data.filter(c =>
      c.name.toLowerCase().includes(t) ||
      c.symbol.toLowerCase().includes(t) ||
      c.id.toLowerCase().includes(t)
    );
    // Une recherche cherche dans tout ce qui est chargé : la limite de vue
    // ne doit pas cacher un résultat trouvé.
    this.afficher(res, true);
  },

  /**
   * ⏰ Auto-refresh toutes les 60 secondes (rafraîchit les données, pas une animation)
   */
  startAutoRefresh() {
    setInterval(() => this.charger(), 60000);
    console.log('⏰ MIDAS: auto-refresh activé (60s)');
  }
};

// 🚀 DÉMARRAGE AUTOMATIQUE
window.addEventListener('DOMContentLoaded', () => {
  Midas.charger();
  Midas.startAutoRefresh();
});
</script>
</body>
</html>
