project_id = "rnuripmfozlxenryxhdc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Edge Function de l'agent de sécurité.
# verify_jwt = true → exige un utilisateur authentifié (guardrail).
[functions.security-agent]
verify_jwt = true
import_map = "./functions/security-agent/import_map.json"

[functions.ai-proxy]
verify_jwt = false   # passer à true une fois le token de session branché
