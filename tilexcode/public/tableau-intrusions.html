<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    connect-src 'self' https://rnuripmfozlxenryxhdc.supabase.co;
    img-src 'self' data:;
    base-uri 'none';
    object-src 'none';
    frame-ancestors 'none';
    form-action 'none';
  " />
  <title>ti-lex — Tableau des intrusions</title>
  <style>
    :root{--bg:#0b0f17;--surf:#131a26;--txt:#e8edf5;--muet:#8a96a8;--bord:rgba(255,255,255,.08);}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
    .enrobe{max-width:1100px;margin:0 auto;padding:28px 18px 60px;}
    .tete{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
    h1{font-size:24px;margin:0;}
    .marque{color:var(--muet);font-size:13px;}
    /* Login */
    #vue-login{max-width:380px;margin:60px auto;background:var(--surf);
      border:1px solid var(--bord);border-radius:16px;padding:26px;}
    #vue-login h2{margin:0 0 16px;font-size:18px;}
    label{display:block;font-size:13px;color:var(--muet);margin:12px 0 6px;}
    input{width:100%;padding:11px;border-radius:10px;background:#0e1521;color:var(--txt);
      border:1px solid var(--bord);font-size:14px;}
    button{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:14px;
      padding:11px 18px;color:#fff;}
    .primaire{background:#2563eb;width:100%;margin-top:18px;}
    .ghost{background:transparent;border:1px solid var(--bord);color:var(--txt);}
    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0;}
    .carte{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:18px;}
    .carte .val{font-size:30px;font-weight:800;margin-top:4px;}
    .carte .lbl{font-size:12px;color:var(--muet);text-transform:uppercase;letter-spacing:1px;}
    .accent-r{border-left:3px solid #ef4444;} .accent-o{border-left:3px solid #f59e0b;}
    .accent-c{border-left:3px solid #22d3ee;}
    /* Table */
    .barre{display:flex;gap:10px;margin-bottom:12px;}
    table{width:100%;border-collapse:collapse;background:var(--surf);border-radius:12px;overflow:hidden;}
    th,td{text-align:left;padding:11px 12px;font-size:13px;border-bottom:1px solid var(--bord);}
    th{color:var(--muet);text-transform:uppercase;font-size:11px;letter-spacing:.5px;}
    td.ua{color:var(--muet);font-family:ui-monospace,monospace;max-width:240px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    td.quand{color:var(--muet);white-space:nowrap;}
    td.vide{text-align:center;color:var(--muet);padding:30px;}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;}
    #vue-tableau{display:none;}
    #tilex-toast-zone{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9999;}
    .tilex-toast{padding:11px 16px;border-radius:10px;color:#fff;font-size:14px;}
    .tilex-toast-error{background:#ef4444;} .tilex-toast-attention{background:#f59e0b;color:#1a1205;}
    .tilex-toast-info{background:#2563eb;} .tilex-toast-success{background:#10b981;}
  </style>
</head>
<body>
  <div class="enrobe">
    <!-- VUE LOGIN -->
    <div id="vue-login">
      <h2>Accès admin</h2>
      <div class="marque">Tableau des intrusions · Produit du Québec</div>
      <label for="admin-courriel">Courriel</label>
      <input id="admin-courriel" type="email" autocomplete="username" />
      <label for="admin-mdp">Mot de passe</label>
      <input id="admin-mdp" type="password" autocomplete="current-password" />
      <button class="primaire" id="btn-connexion">Se connecter</button>
    </div>

    <!-- VUE TABLEAU -->
    <div id="vue-tableau">
      <div class="tete">
        <div>
          <h1>Intrusions détectées</h1>
          <div class="marque">Couche Leurre · ti-lex</div>
        </div>
        <div class="barre">
          <button class="ghost" id="btn-rafraichir">Rafraîchir</button>
          <button class="ghost" id="btn-deconnexion">Déconnexion</button>
        </div>
      </div>

      <div class="stats">
        <div class="carte accent-r"><div class="lbl">Total</div><div class="val" id="stat-total">0</div></div>
        <div class="carte accent-o"><div class="lbl">Dernières 24h</div><div class="val" id="stat-24">0</div></div>
        <div class="carte accent-c"><div class="lbl">Raison la + fréquente</div><div class="val" id="stat-top" style="font-size:16px">—</div></div>
      </div>

      <table>
        <thead>
          <tr><th>Raison</th><th>Lieu</th><th>Appareil</th><th>IP</th><th>Hôte</th><th>Quand</th></tr>
        </thead>
        <tbody id="corps-table">
          <tr><td colspan="6" class="vide">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tableau-intrusions.js"></script>
</body>
</html>
