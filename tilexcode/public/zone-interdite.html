<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Chargement</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      background:#0b0f17;color:#8a96a8;font-family:system-ui,sans-serif;}
    .boite{text-align:center;max-width:420px;padding:24px;}
    .spin{width:34px;height:34px;border:3px solid #2a3344;border-top-color:#5b6b86;
      border-radius:50%;margin:0 auto 18px;animation:t 1s linear infinite;}
    @keyframes t{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="boite">
    <div class="spin"></div>
    <h1 style="font-size:18px;color:#aab4c4;">Chargement de la ressource…</h1>
    <p>Le contenu demandé est en préparation. Merci de patienter.</p>
  </div>
  <!-- Page-piège (tarpit). Aucune vraie donnée ici. Les accès légitimes
       n'atterrissent jamais sur cette page. -->
</body>
</html>
